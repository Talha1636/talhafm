<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SesliChat Pro</title>
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
/* --- RESET & ROOT --- */
:root{--bg-0:#0c0e12;--bg-1:#13161c;--bg-2:#1a1e26;--bg-3:#232830;--primary:#2979ff;--primary-dim:rgba(41,121,255,.15);--green:#00e676;--green-dim:rgba(0,230,118,.15);--red:#ff5252;--orange:#ffab40;--txt:#e0e0e0;--txt2:#9e9e9e;--txt3:#616161;--bdr:#1e222a;--radius:4px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg-0);color:var(--txt);font-size:13px}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg-1)}::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:3px}
input,textarea,button{font-family:inherit;outline:none;border:none;background:none;color:var(--txt)}

/* --- LOGIN --- */
.login-ov{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);z-index:999;display:flex;align-items:center;justify-content:center;transition:.3s}
.login-ov.hide{opacity:0;pointer-events:none}
.login-box{background:var(--bg-1);border:1px solid var(--bdr);padding:32px;width:320px;text-align:center}
.login-box h1{color:var(--primary);font-size:18px;margin-bottom:8px;font-weight:700}
.login-box p{color:var(--txt2);font-size:12px;margin-bottom:24px}
.login-inp{width:100%;padding:12px;background:var(--bg-2);border:1px solid var(--bdr);border-radius:var(--radius);color:var(--txt);font-size:14px;margin-bottom:16px;text-align:center}
.login-inp:focus{border-color:var(--primary)}
.login-btn{width:100%;padding:12px;background:var(--primary);color:#fff;border-radius:var(--radius);font-weight:700;cursor:pointer;transition:.2s}
.login-btn:hover{background:#1565c0}

/* --- LAYOUT --- */
.app{display:grid;grid-template-columns:160px 1fr 200px;height:100vh}

/* --- HEADER --- */
.header{grid-column:1/-1;height:42px;background:var(--bg-1);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:10}
.h-left{display:flex;align-items:center;gap:12px}
.h-logo{font-weight:700;color:var(--primary);font-size:14px}
.h-room{color:var(--txt2);font-size:13px;font-weight:600}
.h-right{display:flex;align-items:center;gap:10px}
.h-btn{width:30px;height:30px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:var(--txt2);cursor:pointer;font-size:13px;transition:.15s}
.h-btn:hover{background:var(--bg-3);color:var(--txt)}
.h-btn.active-mic{color:var(--green);background:var(--green-dim)}
.h-nick{font-size:12px;font-weight:600;color:var(--txt2);background:var(--bg-2);padding:4px 10px;border-radius:12px}
.h-mob{display:none}

/* --- PANELS --- */
.panel-l{background:var(--bg-1);border-right:1px solid var(--bdr);overflow-y:auto;padding-bottom:20px}
.panel-r{background:var(--bg-1);border-left:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden}
.p-title{padding:12px 12px 8px;font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:1px}
.room-btn{width:calc(100% - 16px);margin:1px 8px;padding:8px 10px;border-radius:var(--radius);font-size:12px;font-weight:500;color:var(--txt2);display:flex;align-items:center;gap:8px;cursor:pointer;transition:.15s}
.room-btn:hover{background:var(--bg-2);color:var(--txt)}
.room-btn.active{background:var(--bg-3);color:var(--txt);font-weight:600}
.room-btn i{font-size:11px;width:14px;text-align:center}
.room-count{margin-left:auto;background:var(--red);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px;font-weight:700}

/* --- CHAT AREA --- */
.chat-area{display:flex;flex-direction:column;background:var(--bg-0);overflow:hidden}
.msg-container{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:3px}
.msg-row{padding:2px 4px;border-radius:var(--radius);display:flex;gap:8px;line-height:1.4}
.msg-row:hover{background:rgba(255,255,255,.02)}
.msg-row.self{flex-direction:row-reverse}
.msg-meta{white-space:nowrap;font-size:12px}
.msg-nick{font-weight:700;cursor:pointer}
.msg-time{color:var(--txt3);margin-left:6px;font-size:11px}
.msg-txt{color:var(--txt);word-break:break-word;white-space:pre-wrap}
.msg-row.self .msg-txt{color:var(--primary)}
.msg-sys{text-align:center;padding:6px 0;color:var(--txt3);font-size:11px;background:none}

/* --- INPUT BAR --- */
.input-bar{padding:10px;background:var(--bg-1);border-top:1px solid var(--bdr);display:flex;align-items:flex-end;gap:8px}
.in-box{flex:1;background:var(--bg-2);border:1px solid var(--bdr);border-radius:var(--radius);display:flex;align-items:center;padding:0 8px;transition:.2s}
.in-box:focus-within{border-color:var(--primary)}
.in-box button{padding:8px;color:var(--txt3);cursor:pointer;font-size:14px}
.in-box button:hover{color:var(--txt)}
.chat-inp{flex:1;background:transparent;border:none;color:var(--txt);padding:8px 4px;resize:none;max-height:60px;font-size:13px}
.chat-inp::placeholder{color:var(--txt3)}
.send-btn{padding:0 14px;height:36px;background:var(--primary);color:#fff;border-radius:var(--radius);font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px;flex-shrink:0}
.send-btn:hover{background:#1565c0}
.mic-toggle{width:36px;height:36px;background:var(--bg-3);border-radius:var(--radius);color:var(--txt2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s}
.mic-toggle:hover{background:var(--bg-2)}
.mic-toggle.on{background:var(--green);color:#fff;box-shadow:0 0 10px rgba(0,230,118,.3)}

/* --- RIGHT USERS --- */
.u-header{padding:12px;border-bottom:1px solid var(--bdr);font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;display:flex;justify-content:space-between}
.u-header span{background:var(--bg-3);padding:1px 6px;border-radius:8px;color:var(--txt2);font-size:9px}
.u-scroll{flex:1;overflow-y:auto;padding:6px 0}
.u-item{display:flex;align-items:center;gap:8px;padding:6px 12px;cursor:pointer;transition:.15s}
.u-item:hover{background:var(--bg-2)}
.u-av{width:28px;height:28px;border-radius:50%;background:var(--bg-3);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--txt);position:relative;flex-shrink:0}
.u-dot{position:absolute;bottom:-1px;right:-1px;width:9px;height:9px;border-radius:50%;border:2px solid var(--bg-1)}
.u-dot.on{background:var(--green)} .u-dot.off{background:var(--txt3)}
.u-info{min-width:0;flex:1}
.u-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-status{font-size:10px;color:var(--txt3);display:flex;align-items:center;gap:4px}
.u-status i{font-size:8px}
.u-status.mic-on i{color:var(--green)}
.speaking-pulse{animation:sp 1s infinite}
@keyframes sp{0%,100%{opacity:1}50%{opacity:.4}}

/* --- TOAST --- */
.toast-wrap{position:fixed;top:50px;right:12px;z-index:1000;display:flex;flex-direction:column;gap:6px}
.toast{background:var(--bg-3);border:1px solid var(--bdr);padding:10px 14px;border-radius:var(--radius);font-size:12px;display:flex;align-items:center;gap:8px;animation:tIn .3s forwards;border-left:3px solid var(--primary)}
.toast.ok{border-left-color:var(--green)}.toast.err{border-left-color:var(--red)}
@keyframes tIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* --- MOBILE --- */
.mob-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}
@media(max-width:768px){
    .app{grid-template-columns:1fr}
    .panel-l,.panel-r{position:fixed;top:42px;bottom:0;width:260px;z-index:50;background:var(--bg-1);transform:translateX(-100%);transition:.2s}
    .panel-r{right:0;left:auto;transform:translateX(100%)}
    .panel-l.open,.panel-r.open{transform:translateX(0)}
    .h-mob{display:flex}
    .mob-overlay.show{display:block}
}
</style>
</head>
<body>

<div class="toast-wrap" id="toasts"></div>
<div class="mob-overlay" id="mobOv" onclick="closeMob()"></div>

<!-- GİRİŞ EKRANI -->
<div class="login-ov" id="loginOv">
<div class="login-box">
    <h1><i class="fas fa-comments"></i> SesliChat</h1>
    <p>Gerçek zamanlı yazılı ve sesli sohbet platformu</p>
    <input type="text" class="login-inp" id="nickInp" placeholder="Kullanıcı adınız" maxlength="15">
    <button class="login-btn" id="loginBtn">Sohbete Katıl</button>
</div>
</div>

<!-- ANA UYGULAMA -->
<div class="app" id="appUI" style="display:none">
    <!-- HEADER -->
    <header class="header">
        <div class="h-left">
            <button class="h-btn h-mob" id="mobMenuBtn"><i class="fas fa-bars"></i></button>
            <div class="h-logo">SesliChat</div>
            <div class="h-room"># genel</div>
        </div>
        <div class="h-right">
            <button class="h-btn h-mob" id="mobUsersBtn"><i class="fas fa-users"></i></button>
            <div class="h-nick" id="hNick">Kullanıcı</div>
            <button class="h-btn" id="hMicBtn" title="Mikrofon Aç/Kapat"><i class="fas fa-microphone-slash"></i></button>
            <button class="h-btn" onclick="location.reload()" title="Çıkış Yap"><i class="fas fa-right-from-bracket"></i></button>
        </div>
    </header>

    <!-- SOL PANEL -->
    <aside class="panel-l" id="panelL">
        <div class="p-title">Odalar</div>
        <button class="room-btn active"><i class="fas fa-hashtag"></i> genel <span class="room-count" id="roomC">0</span></button>
        <button class="room-btn"><i class="fas fa-hashtag"></i> sohbet</button>
        <button class="room-btn"><i class="fas fa-hashtag"></i> müzik</button>
        <button class="room-btn"><i class="fas fa-hashtag"></i> oyun</button>
        <button class="room-btn"><i class="fas fa-hashtag"></i> +18</button>
    </aside>

    <!-- ORTA SOHBET -->
    <main class="chat-area">
        <div class="msg-container" id="msgBox"></div>
        <div class="input-bar">
            <div class="in-box">
                <button><i class="far fa-face-smile"></i></button>
                <textarea class="chat-inp" id="msgInp" placeholder="Mesaj yazın..." rows="1"></textarea>
            </div>
            <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
            <button class="mic-toggle" id="micToggle" title="Mikrofonu Aç/Kapat (Basılı Tut)"><i class="fas fa-microphone-slash"></i></button>
        </div>
    </main>

    <!-- SAĞ PANEL -->
    <aside class="panel-r" id="panelR">
        <div class="u-header">Çevrimiçi <span id="onC">0</span></div>
        <div class="u-scroll" id="uList"></div>
    </aside>
</div>

<script>
/* =====================================================================
   RENDE.COM URL'Nİ BURAYA YAZ (SONUNDA / OLMAMALI)
   ÖR: https://my-chat-backend.onrender.com
   ===================================================================== */
const SERVER_URL = "https://talhafm.onrender.com";

/* --- DEĞİŞKENLER --- */
let socket = null;
let localStream = null;
let peers = {};
let mySocketId = null;
let myName = "";
let isMicActive = false;

const COLS = ['#e57373','#64b5f6','#81c784','#ffb74d','#ba68c8','#4dd0e1','#ff8a65','#a1887f'];
function getCol(n) { let h=0; for(let i=0;i<n.length;i++) h=n.charCodeAt(i)+((h<<5)-h); return COLS[Math.abs(h)%COLS.length]; }

/* --- YARDIMCI FONKSİYONLAR --- */
function toast(m, t="info") {
    const b = document.getElementById('toasts');
    const d = document.createElement('div');
    d.className = `toast ${t}`;
    const ic = t==='ok'?'check-circle':(t==='err'?'times-circle':'info-circle');
    const cl = t==='ok'?'green':(t==='err'?'red':'primary');
    d.innerHTML = `<i class="fas fa-${ic}" style="color:var(--${cl})"></i>${m}`;
    b.appendChild(d);
    setTimeout(() => { d.style.opacity='0'; d.style.transition='.3s'; setTimeout(()=>d.remove(), 300); }, 3000);
}

function closeMob() {
    document.getElementById('panelL').classList.remove('open');
    document.getElementById('panelR').classList.remove('open');
    document.getElementById('mobOv').classList.remove('show');
}

/* =====================================================================
   1. GİRİŞ VE BAĞLANTI (HATA ENGELLEME KODU BURADA)
   ===================================================================== */
async function handleLogin() {
    myName = document.getElementById('nickInp').value.trim();
    if (myName.length < 2) return toast("Geçerli bir isim girin.", "err");

    try {
        // SOCKET.IO BAĞLANTISI (HATA YAKALAMA VAR)
        socket = io(SERVER_URL, { 
            transports: ['websocket', 'polling'], 
            timeout: 5000 
        });

        // BAĞLANTI GERÇEKLEŞTİĞİNDE EVENT'LARI TANIMLA
        socket.on('connect', () => {
            mySocketId = socket.id;
            socket.emit('login', myName); // Sunucuya ismi gönder
            
            document.getElementById('loginOv').classList.add('hide');
            document.getElementById('appUI').style.display = 'grid';
            document.getElementById('hNick').textContent = myName;
            
            toast("Sunucuya bağlandınız.", "ok");
            initWebRTCListeners(); // WebRTC dinleyicilerini başlat
        });

        socket.on('disconnect', () => {
            toast("Bağlantı koptu, yeniden bağlanılıyor...", "err");
        });

        // --- SOHBET EVENT'LARI ---
        socket.on('user_list', (users) => renderUsers(users));
        socket.on('user_joined', (user) => addUserToUI(user));
        socket.on('user_left', (data) => removeUserFromUI(data.id));
        socket.on('system_msg', (data) => appendMsg({ user: 'Sistem', text: data.text, sys: true }));
        socket.on('new_msg', (msg) => appendMsg(msg));
        
        // SES DURUMU GÜNCELLEMELERİ
        socket.on('user_mic_update', (data) => updateMicUI(data.id, data.micOn));
        socket.on('user_speaking_update', (data) => updateSpeakingUI(data.id, data.isSpeaking));

    } catch(err) {
        console.error("Bağlantı hatası:", err);
        toast("Sunucuya ulaşılamıyor.", "err");
    }
}

/* =====================================================================
   2. MESAJ SİSTEMİ
   ===================================================================== */
function sendMsg() {
    const inp = document.getElementById('msgInp');
    const text = inp.value.trim();
    if (!text || !socket) return;
    
    socket.emit('send_msg', { text: text });
    inp.value = '';
    inp.style.height = 'auto';
}

function appendMsg(m) {
    const box = document.getElementById('msgBox');
    if (m.sys) {
        box.innerHTML += `<div class="msg-sys">*** ${m.text} ***</div>`;
    } else {
        const isMe = m.user === myName;
        const color = getCol(m.user);
        box.innerHTML += `
            <div class="msg-row ${isMe ? 'self' : ''}">
                <div class="msg-meta">
                    <span class="msg-nick" style="color:${color}">${m.user}</span>
                    <span class="msg-time">${m.time || ''}</span>
                </div>
                <div class="msg-txt">${m.text}</div>
            </div>`;
    }
    box.scrollTop = box.scrollHeight;
}

/* =====================================================================
   3. KULLANICI LİSTESİ VE UI GÜNCELLEMELERİ
   ===================================================================== */
function renderUsers(users) {
    document.getElementById('onC').textContent = users.length;
    document.getElementById('roomC').textContent = users.length;
    let h = '';
    users.forEach(u => { h += createUserHTML(u); });
    document.getElementById('uList').innerHTML = h;
}

function addUserToUI(user) {
    document.getElementById('uList').innerHTML += createUserHTML(user);
    const countEl = document.getElementById('onC');
    countEl.textContent = parseInt(countEl.textContent) + 1;
    document.getElementById('roomC').textContent = countEl.textContent;
}

function removeUserFromUI(id) {
    const el = document.getElementById('u-' + id);
    if (el) el.remove();
    const countEl = document.getElementById('onC');
    countEl.textContent = Math.max(0, parseInt(countEl.textContent) - 1);
    document.getElementById('roomC').textContent = countEl.textContent;
}

function createUserHTML(u) {
    const c = getCol(u.name);
    const micClass = u.micOn ? 'mic-on' : '';
    const speakClass = u.isSpeaking ? 'speaking-pulse' : '';
    const micIcon = u.micOn ? 'fa-microphone' : 'fa-microphone-slash';
    const statusText = u.micOn ? (u.isSpeaking ? 'Konuşuyor' : 'Dinlemede') : 'Sessiz';
    
    return `<div class="u-item" id="u-${u.id}">
        <div class="u-av" style="background:${c}22;color:${c}">${u.name[0].toUpperCase()}<div class="u-dot on"></div></div>
        <div class="u-info">
            <div class="u-name">${u.name}</div>
            <div class="u-status ${micClass} ${speakClass}"><i class="fas ${micIcon}"></i> ${statusText}</div>
        </div>
    </div>`;
}

function updateMicUI(id, isOn) {
    const el = document.getElementById('u-' + id);
    if (!el) return;
    const statusDiv = el.querySelector('.u-status');
    const icon = statusDiv.querySelector('i');
    if (isOn) {
        statusDiv.classList.add('mic-on');
        icon.className = 'fas fa-microphone';
        statusDiv.lastChild.textContent = ' Dinlemede';
    } else {
        statusDiv.classList.remove('mic-on', 'speaking-pulse');
        icon.className = 'fas fa-microphone-slash';
        statusDiv.lastChild.textContent = ' Sessiz';
    }
}

function updateSpeakingUI(id, isSpeaking) {
    const el = document.getElementById('u-' + id);
    if (!el) return;
    const statusDiv = el.querySelector('.u-status');
    if (isSpeaking) {
        statusDiv.classList.add('speaking-pulse');
        statusDiv.lastChild.textContent = ' Konuşuyor';
    } else {
        statusDiv.classList.remove('speaking-pulse');
        statusDiv.lastChild.textContent = ' Dinlemede';
    }
}

/* =====================================================================
   4. WEBRTC VE MİKROFON SİSTEMİ (EN KRİTİK KISIM)
   ===================================================================== */
const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

function initWebRTCListeners() {
    if (!socket) return;

    socket.on('new_peer', (data) => {
        if (isMicActive && localStream) {
            createPeer(data.senderId, true); // Ben initiator oluyorum
        }
    });

    socket.on('offer', (data) => {
        if (!isMicActive || !localStream) return;
        createPeer(data.senderId, false).then(pc => {
            pc.setRemoteDescription(new RTCSessionDescription(data.offer))
                .then(() => pc.createAnswer())
                .then(answer => pc.setLocalDescription(answer))
                .then(() => {
                    socket.emit('answer', { targetId: data.senderId, answer: pc.localDescription });
                }).catch(e => console.error("Offer hatası:", e));
        });
    });

    socket.on('answer', (data) => {
        const pc = peers[data.senderId];
        if (pc) pc.setRemoteDescription(new RTCSessionDescription(data.answer)).catch(e=>console.error(e));
    });

    socket.on('ice_candidate', (data) => {
        const pc = peers[data.senderId];
        if (pc) pc.addIceCandidate(new RTCIceCandidate(data.candidate)).catch(e=>console.error(e));
    });
}

function createPeer(targetId, isInitiator) {
    if (peers[targetId]) return Promise.resolve(peers[targetId]); // Duplicate engelle

    const pc = new RTCPeerConnection(rtcConfig);
    peers[targetId] = pc;

    // Sesi ekle
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    // Karşıdan ses gelince çal
    const audio = new Audio();
    audio.autoplay = true;
    pc.ontrack = (event) => { audio.srcObject = event.streams[0]; };

    // Bağlantı durumu takibi (Memory leak engelle)
    pc.onconnectionstatechange = () => {
        if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed' || pc.connectionState === 'closed') {
            delete peers[targetId]; // Belleği temizle
        }
    };

    pc.onicecandidate = (event) => {
        if (event.candidate) {
            socket.emit('ice_candidate', { targetId: targetId, candidate: event.candidate });
        }
    };

    if (isInitiator) {
        return pc.createOffer()
            .then(offer => pc.setLocalDescription(offer))
            .then(() => {
                socket.emit('offer', { targetId: targetId, offer: pc.localDescription });
                return pc;
            }).catch(e => { console.error("Offer oluşturulamadı:", e); return pc; });
    }

    return Promise.resolve(pc);
}

// MİKROFON TOGGLE (AÇMA / KAPAMA)
async function toggleMic() {
    if (!socket) return;

    if (isMicActive) {
        // KAPAT
        isMicActive = false;
        if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
        for (let id in peers) { peers[id].close(); delete peers[id]; } // Tüm peerları temizle
        document.getElementById('micToggle').classList.remove('on');
        document.getElementById('micToggle').innerHTML = '<i class="fas fa-microphone-slash"></i>';
        document.getElementById('hMicBtn').classList.remove('active-mic');
        document.getElementById('hMicBtn').innerHTML = '<i class="fas fa-microphone-slash"></i>';
        socket.emit('toggle_mic', false);
        socket.emit('speaking_status', false);
        toast("Mikrofon kapatıldı.", "err");
    } else {
        // AÇ
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            isMicActive = true;
            
            document.getElementById('micToggle').classList.add('on');
            document.getElementById('micToggle').innerHTML = '<i class="fas fa-microphone"></i>';
            document.getElementById('hMicBtn').classList.add('active-mic');
            document.getElementById('hMicBtn').innerHTML = '<i class="fas fa-microphone"></i>';
            
            socket.emit('toggle_mic', true);
            socket.emit('join_voice_net'); // Odadaki diğerlerine "Bana bağlanın" diye haber ver
            
            toast("Mikrofon açıldı.", "ok");
            startSpeakingDetection(); // Konuşma algılamayı başlat
        } catch(err) {
            console.error(err);
            toast("Mikrofon izni verilmedi veya bir hata oluştu!", "err");
        }
    }
}

// SES SEVİYESİNE GÖRE "KONUŞUYOR" ANİMASYONU (Web Audio API)
function startSpeakingDetection() {
    if (!localStream) return;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const analyser = audioCtx.createAnalyser();
    const source = audioCtx.createMediaStreamSource(localStream);
    source.connect(analyser);
    analyser.fftSize = 512;
    const dataArray = new Uint8Array(analyser.frequencyBinCount);
    
    let isSpeaking = false;
    function detect() {
        if (!isMicActive) return; // Mikrofon kapatıldıysa durdur
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for(let i=0; i<dataArray.length; i++) sum += dataArray[i];
        let avg = sum / dataArray.length;
        
        // Eşik değeri (Ses seviyesi)
        if (avg > 15 && !isSpeaking) {
            isSpeaking = true;
            socket.emit('speaking_status', true);
        } else if (avg <= 15 && isSpeaking) {
            isSpeaking = false;
            socket.emit('speaking_status', false);
        }
        requestAnimationFrame(detect);
    }
    detect();
}
