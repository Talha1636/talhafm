<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SesliChat Pro - Global WebRTC</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<!-- SOCKET.IO İSTEMCİSİ (Sunucu ile anlık iletişim için) -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
:root{--bg-0:#0e1013;--bg-1:#161920;--bg-2:#1e222b;--bg-3:#272c37;--bg-4:#323844;--primary:#0088ff;--primary-d:#006acc;--green:#2ecc71;--red:#e74c3c;--orange:#f39c12;--txt:#e2e4e8;--txt2:#8b919a;--txt3:#555d68;--bdr:#252a33;--r:6px;--sh:0 4px 20px rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg-0);color:var(--txt);display:flex;flex-direction:column}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:3px}
input,textarea,button{font-family:inherit}
.app{display:flex;flex-direction:column;height:100vh}
.hide{display:none!important}
.hdr{height:48px;background:var(--bg-1);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0;z-index:20}
.logo{font-weight:800;font-size:15px;color:var(--primary);display:flex;align-items:center;gap:6px}
.logo i{font-size:20px}
.hdr-r{display:flex;align-items:center;gap:8px}
.h-icon{width:32px;height:32px;border-radius:50%;background:var(--bg-2);border:none;color:var(--txt2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;transition:.2s}
.h-icon:hover{background:var(--bg-3);color:var(--txt)}
.h-pill{display:flex;align-items:center;gap:6px;background:var(--bg-2);padding:4px 10px 4px 4px;border-radius:16px;cursor:pointer;transition:.2s}
.h-pill:hover{background:var(--bg-3)}
.h-pav{width:24px;height:24px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.h-pill span{font-size:12px;font-weight:600}
.main{flex:1;display:flex;overflow:hidden;position:relative}
.sb-l{width:180px;background:var(--bg-1);border-right:1px solid var(--bdr);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sb-cat{padding:14px 12px 4px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--txt3)}
.r-item{display:flex;align-items:center;gap:8px;padding:8px 10px;margin:1px 6px;border-radius:var(--r);font-size:12px;font-weight:500;color:var(--txt2);cursor:pointer;transition:.15s;border:none;background:none;width:calc(100% - 12px);text-align:left}
.r-item:hover{background:var(--bg-2);color:var(--txt)}
.r-item.act{background:var(--bg-3);color:#fff;font-weight:600}
.r-item i{width:14px;text-align:center;font-size:11px}
.chat{flex:1;display:flex;flex-direction:column;background:var(--bg-0);min-width:0}
.ch-hdr{height:42px;background:var(--bg-1);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0}
.ch-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.ch-title i{color:var(--txt3);font-size:14px}
.live-badge{display:none;align-items:center;gap:4px;background:rgba(46,204,113,.12);color:var(--green);padding:2px 8px;border-radius:10px;font-size:9px;font-weight:800;letter-spacing:.5px}
.live-badge.on{display:inline-flex}
.live-badge i{font-size:6px;animation:lp 1.2s infinite}
@keyframes lp{0%,100%{opacity:1}50%{opacity:.3}}
.ch-acts{display:flex;gap:2px}
.ch-acts button{background:none;border:none;color:var(--txt3);padding:6px 8px;border-radius:var(--r);cursor:pointer;font-size:12px;transition:.2s}
.ch-acts button:hover{background:var(--bg-2);color:var(--txt)}
.ch-acts button.active-voice{color:var(--green)}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:4px}
.msg{display:flex;gap:8px;padding:3px 0;animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.me{flex-direction:row-reverse}
.m-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0}
.m-body{max-width:75%}
.m-head{display:flex;align-items:center;gap:6px;margin-bottom:1px}
.msg.me .m-head{flex-direction:row-reverse}
.m-name{font-size:12px;font-weight:700}
.m-time{font-size:9px;color:var(--txt3)}
.m-txt{font-size:13px;line-height:1.4;color:#c8cbd0;white-space:pre-wrap;word-break:break-word}
.msg.me .m-txt{background:var(--primary);color:#fff;padding:7px 11px;border-radius:10px 3px 10px 10px;display:inline-block}
.msg-sys{text-align:center;padding:6px 0}
.msg-sys span{background:var(--bg-2);color:var(--txt2);font-size:11px;padding:3px 10px;border-radius:10px}
.ch-ft{padding:8px 12px;background:var(--bg-1);border-top:1px solid var(--bdr);flex-shrink:0}
.in-row{display:flex;align-items:center;gap:6px}
.in-wrap{flex:1;background:var(--bg-2);border:1px solid var(--bdr);border-radius:var(--r);display:flex;align-items:center;padding:0 6px;transition:.2s}
.in-wrap:focus-within{border-color:var(--primary)}
.in-wrap button{background:none;border:none;color:var(--txt3);padding:7px;font-size:14px;cursor:pointer}
.in-wrap button:hover{color:var(--txt)}
.m-inp{flex:1;background:transparent;border:none;color:var(--txt);padding:8px 4px;font-size:13px;outline:none;resize:none;max-height:60px}
.m-inp::placeholder{color:var(--txt3)}
.ptt{background:var(--bg-3);color:var(--txt);border:1px solid var(--bdr);border-radius:var(--r);padding:0 14px;height:38px;font-weight:700;font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;-webkit-user-select:none;flex-shrink:0;transition:.1s}
.ptt:active,.ptt.on{background:var(--green);color:#fff;border-color:var(--green);transform:scale(.97)}
.ptt.on .ptt-t{display:none}
.ptt-w{display:none;align-items:center;gap:2px;height:16px}
.ptt.on .ptt-w{display:flex}
.ptt-w span{width:3px;background:#fff;border-radius:2px;animation:vw .4s infinite ease-in-out}
.ptt-w span:nth-child(1){height:6px;animation-delay:0s}
.ptt-w span:nth-child(2){height:12px;animation-delay:.1s}
.ptt-w span:nth-child(3){height:8px;animation-delay:.2s}
@keyframes vw{0%,100%{transform:scaleY(1)}50%{transform:scaleY(2.5)}}
.sb-r{width:210px;background:var(--bg-1);border-left:1px solid var(--bdr);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sr-hdr{padding:10px 12px;font-size:11px;font-weight:700;color:var(--txt3);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;text-transform:uppercase}
.sr-hdr span{background:var(--bg-3);padding:1px 7px;border-radius:8px;color:var(--txt2);font-size:9px}
.u-list{padding:6px 0}
.u-it{display:flex;align-items:center;gap:8px;padding:6px 10px;margin:0 4px;border-radius:var(--r);cursor:pointer;transition:.15s}
.u-it:hover{background:var(--bg-2)}
.u-aw{position:relative;flex-shrink:0}
.u-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.u-dot{position:absolute;bottom:-1px;right:-1px;width:9px;height:9px;border-radius:50%;border:2px solid var(--bg-1)}
.u-dot.on{background:var(--green)} .u-dot.off{background:var(--txt3)}
.u-inf{flex:1;min-width:0}
.u-nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-st{font-size:10px;color:var(--txt3);display:flex;align-items:center;gap:3px}
.u-st .mic-on{color:var(--green);font-size:8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.25s;backdrop-filter:blur(3px)}
.ov.on{opacity:1;pointer-events:auto}
.mdl{background:var(--bg-1);border:1px solid var(--bdr);border-radius:8px;width:380px;max-width:92vw;box-shadow:var(--sh);transform:scale(.9);transition:.25s}
.ov.on .mdl{transform:scale(1)}
.mdl-b{padding:24px;text-align:center}
.mi{width:100%;padding:10px;background:var(--bg-2);border:1px solid var(--bdr);border-radius:var(--r);color:var(--txt);font-size:14px;outline:none;margin-bottom:12px;transition:.2s}
.mi:focus{border-color:var(--primary)}
.mb{width:100%;padding:11px;border:none;border-radius:var(--r);font-size:14px;font-weight:700;cursor:pointer;color:#fff;transition:.2s}
.mb-p{background:var(--primary)}.mb-p:hover{background:var(--primary-d)}
.t-box{position:fixed;top:56px;right:12px;z-index:200;display:flex;flex-direction:column;gap:6px}
.t-it{background:var(--bg-3);border:1px solid var(--bdr);padding:10px 14px;border-radius:var(--r);box-shadow:var(--sh);font-size:12px;display:flex;align-items:center;gap:8px;animation:ts .3s forwards;border-left:3px solid var(--primary)}
.t-it.ok{border-left-color:var(--green)}.t-it.err{border-left-color:var(--red)}
@keyframes ts{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@media(max-width:768px){.sb-l,.sb-r{display:none;position:fixed;top:48px;bottom:0;width:260px;z-index:20;box-shadow:var(--sh);background:var(--bg-1)}.sb-l{left:0}.sb-r{right:0}.m-body{max-width:88%}.hdr-mob{display:flex!important}}
.hdr-mob{display:none;width:34px;height:34px;align-items:center;justify-content:center;border-radius:var(--r);background:var(--bg-2);color:var(--txt2);border:none;font-size:15px;cursor:pointer}
</style>
</head>
<body>

<div class="t-box" id="tBox"></div>

<!-- GİRİŞ MODALI -->
<div class="ov on" id="loginOv">
<div class="mdl">
<div class="mdl-b">
<div style="width:56px;height:56px;background:var(--primary);border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff"><i class="fas fa-globe"></i></div>
<h2 style="margin-bottom:6px;font-size:18px">Global Sesli Sohbet</h2>
<p style="color:var(--txt2);font-size:12px;margin-bottom:20px">Dünyanın her yerinden anlık sesli iletişim</p>
<input class="mi" id="nickInp" placeholder="Kullanıcı Adı" maxlength="15" style="text-align:center">
<button class="mb mb-p" id="loginBtn"><i class="fas fa-right-to-bracket" style="margin-right:5px"></i>Bağlan</button>
</div>
</div>
</div>

<!-- ANA UYGULAMA -->
<div class="app hide" id="app">
<header class="hdr">
<div class="hdr-l" style="gap:12px; align-items:center;">
<button class="hdr-mob" id="mobMenuBtn"><i class="fas fa-bars"></i></button>
<div class="logo"><i class="fas fa-headset"></i> SesliChat</div>
</div>
<div class="hdr-r">
<button class="hdr-mob" id="mobUsersBtn" style="margin:0"><i class="fas fa-users"></i></button>
<button class="h-icon" id="logoutBtn" title="Çıkış"><i class="fas fa-right-from-bracket"></i></button>
<div class="h-pill"><div class="h-pav" id="hAv">?</div><span id="hNm">Kullanıcı</span></div>
</div>
</header>

<div class="main">
<aside class="sb-l" id="sbL">
<div class="sb-cat">Sesli Odalar</div>
<button class="r-item act" onclick="switchRoom('genel')"><i class="fas fa-volume-high" style="color:var(--green)"></i>Genel Oda</button>
<button class="r-item" onclick="switchRoom('sohbet')"><i class="fas fa-volume-high" style="color:var(--green)"></i>Rastgele Sohbet</button>
</aside>

<main class="chat">
<div class="ch-hdr">
<div class="ch-title"><i class="fas fa-volume-high"></i><span id="rmName">Genel Oda</span><div class="live-badge" id="liveB"><i class="fas fa-circle"></i> CANLI</div></div>
<div class="ch-acts">
<button id="voiceJoinBtn" title="Sesli Katıl / Ayrıl"><i class="fas fa-microphone"></i></button>
</div>
</div>
<div class="msgs" id="msgBox"></div>
<div class="ch-ft">
<div class="in-row">
<div class="in-wrap">
<button><i class="far fa-face-smile"></i></button>
<textarea class="m-inp" id="msgInp" placeholder="Mesajınızı yazın..." rows="1"></textarea>
<button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
</div>
<button class="ptt" id="pttBtn"><i class="fas fa-microphone"></i><span class="ptt-t">Bas Konuş</span><div class="ptt-w"><span></span><span></span><span></span></div></button>
</div>
</div>
</main>

<aside class="sb-r" id="sbR">
<div class="sr-hdr">Odadaki Kişiler <span id="onC">0</span></div>
<div class="u-list" id="uList"></div>
</aside>
</div>
</div>

<script>
/* =====================================================================
   RENDE.COM URL'Nİ BURAYA YAZ (SONUNDA SLASH OLMAMALI)
   ===================================================================== */
const SERVER_URL = "https://talhafm.onrender.com"; 

/* DEĞİŞKENLER */
var socket = null;
var localStream = null;
var peers = {}; // Socket ID -> RTCPeerConnection
var isInVoice = false;
var mySocketId = null;
var currentRoom = 'genel';
var myName = '';

var COLS = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22'];
function getCol(n) { var h=0; for(var i=0;i<n.length;i++){h=n.charCodeAt(i)+((h<<5)-h);} return COLS[Math.abs(h)%COLS.length]; }

/* =====================================================================
   1. SUNUCUYA BAĞLANMA VE TEXT CHAT
   ===================================================================== */
function doLogin() {
    myName = document.getElementById('nickInp').value.trim();
    if (myName.length < 2) return alert('Geçerli bir isim girin.');
    
    document.getElementById('hAv').textContent = myName[0].toUpperCase();
    document.getElementById('hNm').textContent = myName;

    socket = io(SERVER_URL, { transports: ['websocket'] });

    socket.on('connect', () => {
        mySocketId = socket.id;
        socket.emit('join_room', { name: myName, room: currentRoom });
        
        document.getElementById('loginOv').classList.remove('on');
        document.getElementById('app').classList.remove('hide');
        toast('Sunucuya bağlandın', 'ok');
    });

    socket.on('load_messages', (msgs) => {
        document.getElementById('msgBox').innerHTML = '';
        msgs.forEach(m => appendMessage(m));
    });

    socket.on('new_message', (m) => appendMessage(m));

    socket.on('system_msg', (data) => appendMessage({ user: 'Sistem', text: data.text, sys: true }));

    socket.on('user_list', (users) => renderUsers(users));
}

function sendMsg() {
    var inp = document.getElementById('msgInp');
    var t = inp.value.trim();
    if (!t) return;
    inp.value = ''; inp.style.height = 'auto';
    socket.emit('send_message', { name: myName, text: t, room: currentRoom });
}

function appendMessage(m) {
    var box = document.getElementById('msgBox');
    var isMe = m.user === myName;
    if (m.sys) {
        box.innerHTML += '<div class="msg-sys"><span>' + m.text + '</span></div>';
    } else {
        var c = getCol(m.user);
        box.innerHTML += '<div class="msg ' + (isMe ? 'me' : '') + '">' +
            '<div class="m-av" style="background:' + c + '">' + m.user[0].toUpperCase() + '</div>' +
            '<div class="m-body">' +
                '<div class="m-head"><span class="m-name" style="color:' + c + '">' + m.user + '</span><span class="m-time">' + (m.time || '') + '</span></div>' +
                '<div class="m-txt">' + m.text + '</div>' +
            '</div></div>';
    }
    box.scrollTop = box.scrollHeight;
}

function renderUsers(users) {
    document.getElementById('onC').textContent = users.length;
    var h = '';
    users.forEach(u => {
        var c = getCol(u.name);
        var isSpeaking = peers[u.id] && peers[u.id].connectionState === 'connected';
        var status = isSpeaking ? '<i class="fas fa-microphone mic-on"></i> Konuşuyor' : 'Dinliyor';
        h += '<div class="u-it"><div class="u-aw"><div class="u-av" style="background:' + c + '">' + u.name[0].toUpperCase() + '</div><div class="u-dot on"></div></div><div class="u-inf"><div class="u-nm">' + u.name + '</div><div class="u-st">' + status + '</div></div></div>';
    });
    document.getElementById('uList').innerHTML = h;
}

function switchRoom(room) {
    currentRoom = room;
    document.getElementById('rmName').textContent = room === 'genel' ? 'Genel Oda' : 'Rastgele Sohbet';
    if (isInVoice) leaveVoice(); // Oda değiştirirken sesi kapat
    socket.emit('join_room', { name: myName, room: room });
    document.querySelectorAll('.r-item').forEach(el => el.classList.remove('act'));
    event.currentTarget.classList.add('act');
}

/* =====================================================================
   2. GERÇEK WEBRTC SESLİ İLETİŞİM (RUSYA'DAN DA GELİR)
   ===================================================================== */
var rtcConfig = { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }, { 'urls': 'stun:stun1.l.google.com:19302' }] };

async function joinVoice() {
    if (isInVoice) { leaveVoice(); return; }

    try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    } catch (e) {
        toast('Mikrofon izni verilmeli!', 'err');
        return;
    }

    isInVoice = true;
    document.getElementById('liveB').classList.add('on');
    document.getElementById('voiceJoinBtn').classList.add('active-voice');
    toast('Sesli odaya girildi', 'ok');

    // Sunucuya "Ben sesli odadayım, bana bağlanmak isteyen varsa haber ver" diyorum
    socket.emit('join_voice', { room: currentRoom, name: myName });
}

function leaveVoice() {
    isInVoice = false;
    document.getElementById('liveB').classList.remove('on');
    document.getElementById('voiceJoinBtn').classList.remove('active-voice');
    
    if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
    for (var id in peers) { peers[id].close(); delete peers[id]; }
    
    socket.emit('leave_voice');
    toast('Sesli odadan çıkıldı', 'err');
}

function createPeerConnection(targetSocketId, isInitiator) {
    var pc = new RTCPeerConnection(rtcConfig);
    peers[targetSocketId] = pc;

    // Kendi mikrofonumu karşıya ekle
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    // Karşıdan gelen sesi çal
    var remoteAudio = document.createElement('audio');
    remoteAudio.autoplay = true;
    pc.ontrack = (event) => { remoteAudio.srcObject = event.streams[0]; };

    // Sunucu üzerinden IP adreslerini (ICE Candidate) değiş tokuş et
    pc.onicecandidate = (event) => {
        if (event.candidate) {
            socket.emit('ice_candidate', { targetId: targetSocketId, candidate: event.candidate });
        }
    };

    // Eğer ben odaya son giren kişiysem, herkese teklif (Offer) gönderiyorum
    if (isInitiator) {
        pc.createOffer()
            .then(offer => pc.setLocalDescription(offer))
            .then(() => {
                socket.emit('offer', { targetId: targetSocketId, offer: pc.localDescription });
            });
    }

    return pc;
}

/* --- SOCKET.IO ÜZERİNDEN GELEN WEBRTC SİNYALLERİNİ YAKALAMA --- */

// 1. Odaya yeni biri girdiğinde, ben onaylayıcı (Initiator) oluyorum
socket.on('new_peer', (data) => {
    if (isInVoice && localStream) {
        createPeerConnection(data.senderId, true);
    }
});

// 2. Bana Offer geldiğinde
socket.on('offer', (data) => {
    if (!isInVoice || !localStream) return;
    var pc = createPeerConnection(data.senderId, false);
    pc.setRemoteDescription(new RTCSessionDescription(data.offer))
        .then(() => pc.createAnswer())
        .then(answer => pc.setLocalDescription(answer))
        .then(() => {
            socket.emit('answer', { targetId: data.senderId, answer: pc.localDescription });
        });
});

// 3. Bana Answer geldiğinde
socket.on('answer', (data) => {
    var pc = peers[data.senderId];
    if (pc) pc.setRemoteDescription(new RTCSessionDescription(data.answer));
});

// 4. Bana ICE (IP Adresi) geldiğinde
socket.on('ice_candidate', (data) => {
    var pc = peers[data.senderId];
    if (pc) pc.addIceCandidate(new RTCIceCandidate(data.candidate));
});

/* =====================================================================
   3. PTT (PUSH TO TALK) - SESİ AÇMA KAPAMA
   ===================================================================== */
function pttOn() {
    if (!isInVoice) { toast('Önce sesli odaya girin (Mikrofon ikonuna tıklayın)', 'err'); return; }
    document.getElementById('pttBtn').classList.add('on');
    if (localStream) localStream.getAudioTracks()[0].enabled = true; // Sesi aç
}
function pttOff() {
    document.getElementById('pttBtn').classList.remove('on');
    if (localStream) localStream.getAudioTracks()[0].enabled = false; // Sesi kapat (Sustur)
}

/* =====================================================================
   4. YARDIMCILAR
   ===================================================================== */
function toast(m, t) {
    t=t||'info';var b=document.getElementById('tBox');var d=document.createElement('div');d.className='t-it '+t;
    var icon=t==='ok'?'check-circle':(t==='err'?'times-circle':'info-circle');
    var color=t==='ok'?'green':(t==='err'?'red':'primary');
    d.innerHTML='<i class="fas fa-'+icon+'" style="color:var(--'+color+')"></i>'+m;b.appendChild(d);
    setTimeout(function(){d.style.opacity='0';d.style.transition='.3s';setTimeout(function(){d.remove();},300);},3000);
}

/* EVENT LISTENERS */
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('loginBtn').addEventListener('click', doLogin);
    document.getElementById('nickInp').addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
    
    document.getElementById('voiceJoinBtn').addEventListener('click', joinVoice);
    document.getElementById('logoutBtn').addEventListener('click', () => location.reload());
    
    document.getElementById('sendBtn').addEventListener('click', sendMsg);
    document.getElementById('msgInp').addEventListener('keydown', function(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } });
    document.getElementById('msgInp').addEventListener('input', function() { this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,60)+'px'; });
    
    var pttBtn = document.getElementById('pttBtn');
    pttBtn.addEventListener('mousedown', function(e) { e.preventDefault(); pttOn(); });
    pttBtn.addEventListener('mouseup', pttOff);
    pttBtn.addEventListener('mouseleave', function() { if(pttBtn.classList.contains('on')) pttOff(); });
    pttBtn.addEventListener('touchstart', function(e) { e.preventDefault(); pttOn(); }, {passive: false});
    pttBtn.addEventListener('touchend', function(e) { e.preventDefault(); pttOff(); });

    document.getElementById('mobMenuBtn').addEventListener('click', function() { document.getElementById('sbL').classList.toggle('on'); });
    document.getElementById('mobUsersBtn').addEventListener('click', function() { document.getElementById('sbR').classList.toggle('on'); });
});
</script>
</body>
</html>
