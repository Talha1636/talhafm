<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SesliChat Pro - Profesyonel Sesli Sohbet Platformu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
:root{--bg-0:#0e1013;--bg-1:#161920;--bg-2:#1e222b;--bg-3:#272c37;--bg-4:#323844;--primary:#0088ff;--primary-d:#006acc;--green:#2ecc71;--red:#e74c3c;--orange:#f39c12;--txt:#e2e4e8;--txt2:#8b919a;--txt3:#555d68;--bdr:#252a33;--r:6px;--sh:0 4px 20px rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg-0);color:var(--txt);display:flex;flex-direction:column}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:3px}
input,textarea,button,select{font-family:inherit}

/* GENEL YAPI */
.app{display:flex;flex-direction:column;height:100vh}
.hide{display:none!important}

/* HEADER (Esohnet Tarzı Üst Bar) */
.hdr{height:48px;background:var(--bg-1);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0;z-index:20}
.hdr-l{display:flex;align-items:center;gap:12px}
.hdr-mob{display:none;width:34px;height:34px;align-items:center;justify-content:center;border-radius:var(--r);background:var(--bg-2);color:var(--txt2);border:none;font-size:15px;cursor:pointer}
.logo{font-weight:800;font-size:15px;color:var(--primary);display:flex;align-items:center;gap:6px}
.logo i{font-size:20px}
.hdr-nav{display:flex;gap:2px}
.hdr-nav button{padding:6px 12px;font-size:12px;font-weight:600;color:var(--txt2);background:none;border:none;border-radius:var(--r);cursor:pointer;transition:.2s}
.hdr-nav button:hover,.hdr-nav button.act{background:var(--bg-2);color:var(--txt)}
.hdr-r{display:flex;align-items:center;gap:8px}
.h-icon{width:32px;height:32px;border-radius:50%;background:var(--bg-2);border:none;color:var(--txt2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;transition:.2s}
.h-icon:hover{background:var(--bg-3);color:var(--txt)}
.h-pill{display:flex;align-items:center;gap:6px;background:var(--bg-2);padding:4px 10px 4px 4px;border-radius:16px;cursor:pointer;transition:.2s}
.h-pill:hover{background:var(--bg-3)}
.h-pav{width:24px;height:24px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.h-pill span{font-size:12px;font-weight:600}

/* ANA ALAN */
.main{flex:1;display:flex;overflow:hidden;position:relative}

/* SOL (ODALAR) */
.sb-l{width:180px;background:var(--bg-1);border-right:1px solid var(--bdr);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sb-cat{padding:14px 12px 4px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--txt3)}
.r-item{display:flex;align-items:center;gap:8px;padding:8px 10px;margin:1px 6px;border-radius:var(--r);font-size:12px;font-weight:500;color:var(--txt2);cursor:pointer;transition:.15s;border:none;background:none;width:calc(100% - 12px);text-align:left}
.r-item:hover{background:var(--bg-2);color:var(--txt)}
.r-item.act{background:var(--bg-3);color:#fff;font-weight:600}
.r-item i{width:14px;text-align:center;font-size:11px}
.r-item .rb{margin-left:auto;background:var(--red);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px;font-weight:700}

/* ORTA (SOHBET) */
.chat{flex:1;display:flex;flex-direction:column;background:var(--bg-0);min-width:0}
.ch-hdr{height:42px;background:var(--bg-1);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0}
.ch-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.ch-title i{color:var(--txt3);font-size:14px}
.live-badge{display:none;align-items:center;gap:4px;background:rgba(46,204,113,.12);color:var(--green);padding:2px 8px;border-radius:10px;font-size:9px;font-weight:800;letter-spacing:.5px}
.live-badge.on{display:inline-flex}
.live-badge i{font-size:6px;animation:lp 1.2s infinite}
@keyframes lp{0%,100%{opacity:1}50%{opacity:.3}}
.ch-acts{display:flex;gap:2px}
.ch-acts button{background:none;border:none;color:var(--txt3);padding:6px 8px;border-radius:var(--r);cursor:pointer;font-size:12px;transition:.2s}
.ch-acts button:hover{background:var(--bg-2);color:var(--txt)}

.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:4px}
.msg{display:flex;gap:8px;padding:3px 0;animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.me{flex-direction:row-reverse}
.m-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0;cursor:pointer}
.m-body{max-width:75%}
.m-head{display:flex;align-items:center;gap:6px;margin-bottom:1px}
.msg.me .m-head{flex-direction:row-reverse}
.m-name{font-size:12px;font-weight:700;cursor:pointer}
.m-time{font-size:9px;color:var(--txt3)}
.m-txt{font-size:13px;line-height:1.4;color:#c8cbd0;white-space:pre-wrap;word-break:break-word}
.msg.me .m-txt{background:var(--primary);color:#fff;padding:7px 11px;border-radius:10px 3px 10px 10px;display:inline-block}
.msg-sys{text-align:center;padding:6px 0}
.msg-sys span{background:var(--bg-2);color:var(--txt2);font-size:11px;padding:3px 10px;border-radius:10px}
.voice-tag{display:inline-flex;align-items:center;gap:3px;font-size:9px;color:var(--green);font-weight:600;margin-left:6px}

/* ALT BAR */
.ch-ft{padding:8px 12px;background:var(--bg-1);border-top:1px solid var(--bdr);flex-shrink:0}
.in-row{display:flex;align-items:center;gap:6px}
.in-wrap{flex:1;background:var(--bg-2);border:1px solid var(--bdr);border-radius:var(--r);display:flex;align-items:center;padding:0 6px;transition:.2s}
.in-wrap:focus-within{border-color:var(--primary)}
.in-wrap button{background:none;border:none;color:var(--txt3);padding:7px;font-size:14px;cursor:pointer}
.in-wrap button:hover{color:var(--txt)}
.m-inp{flex:1;background:transparent;border:none;color:var(--txt);padding:8px 4px;font-size:13px;outline:none;resize:none;max-height:60px}
.m-inp::placeholder{color:var(--txt3)}
.ptt{background:var(--bg-3);color:var(--txt);border:1px solid var(--bdr);border-radius:var(--r);padding:0 14px;height:38px;font-weight:700;font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;-webkit-user-select:none;flex-shrink:0;transition:.1s}
.ptt:active,.ptt.on{background:var(--green);color:#fff;border-color:var(--green);transform:scale(.97)}
.ptt.on .ptt-t{display:none}
.ptt-w{display:none;align-items:center;gap:2px;height:16px}
.ptt.on .ptt-w{display:flex}
.ptt-w span{width:3px;background:#fff;border-radius:2px;animation:vw .4s infinite ease-in-out}
.ptt-w span:nth-child(1){height:6px;animation-delay:0s}.ptt-w span:nth-child(2){height:12px;animation-delay:.1s}.ptt-w span:nth-child(3){height:8px;animation-delay:.2s}
@keyframes vw{0%,100%{transform:scaleY(1)}50%{transform:scaleY(2.5)}}

/* SAĞ (KULLANICILAR) */
.sb-r{width:210px;background:var(--bg-1);border-left:1px solid var(--bdr);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sr-hdr{padding:10px 12px;font-size:11px;font-weight:700;color:var(--txt3);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;text-transform:uppercase}
.sr-hdr span{background:var(--bg-3);padding:1px 7px;border-radius:8px;color:var(--txt2);font-size:9px}
.u-list{padding:6px 0}
.u-it{display:flex;align-items:center;gap:8px;padding:6px 10px;margin:0 4px;border-radius:var(--r);cursor:pointer;transition:.15s}
.u-it:hover{background:var(--bg-2)}
.u-aw{position:relative;flex-shrink:0}
.u-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.u-dot{position:absolute;bottom:-1px;right:-1px;width:9px;height:9px;border-radius:50%;border:2px solid var(--bg-1)}
.u-dot.on{background:var(--green)}.u-dot.idle{background:var(--orange)}.u-dot.off{background:var(--txt3)}
.u-inf{flex:1;min-width:0}
.u-nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-st{font-size:10px;color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:3px}
.u-st .mic-on{color:var(--green);font-size:8px}

/* MODALLAR */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.25s;backdrop-filter:blur(3px)}
.ov.on{opacity:1;pointer-events:auto}
.mdl{background:var(--bg-1);border:1px solid var(--bdr);border-radius:8px;width:380px;max-width:92vw;box-shadow:var(--sh);transform:scale(.9);transition:.25s}
.ov.on .mdl{transform:scale(1)}
.mdl-t{padding:18px 18px 0;display:flex;justify-content:space-between;align-items:center}
.mdl-t h2{font-size:16px;font-weight:800}
.mdl-x{background:none;border:none;color:var(--txt3);font-size:18px;cursor:pointer}
.mdl-b{padding:18px}
.mi{width:100%;padding:10px;background:var(--bg-2);border:1px solid var(--bdr);border-radius:var(--r);color:var(--txt);font-size:14px;outline:none;margin-bottom:10px;transition:.2s}
.mi:focus{border-color:var(--primary)}
.mb{width:100%;padding:11px;border:none;border-radius:var(--r);font-size:14px;font-weight:700;cursor:pointer;color:#fff;transition:.2s}
.mb-p{background:var(--primary)}.mb-p:hover{background:var(--primary-d)}
.mb-d{background:var(--red)}.mb-d:hover{background:#c0392b}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bdr)}
.set-row label{font-size:13px}
.tgl{width:38px;height:20px;background:var(--bg-4);border-radius:10px;position:relative;cursor:pointer;transition:.2s}
.tgl.on{background:var(--primary)}
.tgl::after{content:'';position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;top:2px;left:2px;transition:.2s}
.tgl.on::after{left:20px}

/* TOAST */
.t-box{position:fixed;top:56px;right:12px;z-index:200;display:flex;flex-direction:column;gap:6px}
.t-it{background:var(--bg-3);border:1px solid var(--bdr);padding:10px 14px;border-radius:var(--r);box-shadow:var(--sh);font-size:12px;display:flex;align-items:center;gap:8px;animation:ts .3s forwards;border-left:3px solid var(--primary)}
.t-it.ok{border-left-color:var(--green)}.t-it.err{border-left-color:var(--red)}
@keyframes ts{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* MOBİL */
.mob-ov{display:none;position:fixed;inset:0;top:48px;background:rgba(0,0,0,.6);z-index:15}
.mob-ov.on{display:block}

@media(max-width:1024px){.sb-r{display:none;position:fixed;top:48px;bottom:0;right:0;width:240px;z-index:20;box-shadow:var(--sh)}.sb-r.on{display:flex}}
@media(max-width:768px){
.sb-l,.sb-r{display:none;position:fixed;top:48px;bottom:0;width:260px;z-index:20;box-shadow:var(--sh)}
.sb-l.on{display:flex;left:0}.sb-r.on{display:flex;right:0}
.hdr-mob{display:flex}.hdr-nav{display:none}
.m-body{max-width:88%}
}
</style>
</head>
<body>

<div class="t-box" id="tBox"></div>
<div class="mob-ov" id="mobOv" onclick="closePn()"></div>

<!-- GİRİŞ MODALI -->
<div class="ov on" id="loginOv">
<div class="mdl" style="width:340px">
<div class="mdl-b" style="text-align:center;padding:30px">
<div style="width:56px;height:56px;background:var(--primary);border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff"><i class="fas fa-headset"></i></div>
<h2 style="margin-bottom:6px;font-size:18px">Sesli Sohbet</h2>
<p style="color:var(--txt2);font-size:12px;margin-bottom:20px">Odalarına katılmak için ismini gir.</p>
<input class="mi" id="nickInp" placeholder="Kullanıcı Adı" maxlength="15" style="text-align:center">
<button class="mb mb-p" onclick="doLogin()"><i class="fas fa-right-to-bracket" style="margin-right:5px"></i>Bağlan</button>
</div>
</div>
</div>

<!-- AYARLAR MODALI -->
<div class="ov" id="setOv">
<div class="mdl">
<div class="mdl-t"><h2>Ayarlar</h2><button class="mdl-x" onclick="togOv('setOv')"><i class="fas fa-xmark"></i></button></div>
<div class="mdl-b">
<select class="mi"><option>Varsayılan Mikrofon</option></select>
<select class="mi"><option>Varsayılan Hoparlör</option></select>
<div class="set-row"><label>Bildirim Sesleri</label><div class="tgl on" onclick="this.classList.toggle('on')"></div></div>
<div class="set-row"><label>Otomatik Mikrofon Aç</label><div class="tgl" onclick="this.classList.toggle('on')"></div></div>
<button class="mb mb-d" style="margin-top:16px" onclick="doLogout()"><i class="fas fa-right-from-bracket" style="margin-right:5px"></i>Çıkış Yap</button>
</div>
</div>
</div>

<!-- ANA UYGULAMA -->
<div class="app hide" id="app">
<header class="hdr">
<div class="hdr-l">
<button class="hdr-mob" onclick="togPn('l')"><i class="fas fa-bars"></i></button>
<div class="logo"><i class="fas fa-headset"></i> SesliChat</div>
<nav class="hdr-nav"><button class="act">Ana Sayfa</button><button>Odalar</button><button>Tüm Kişiler</button></nav>
</div>
<div class="hdr-r">
<button class="hdr-mob" onclick="togPn('r')" style="margin:0"><i class="fas fa-users"></i></button>
<button class="h-icon" onclick="togOv('setOv')"><i class="fas fa-gear"></i></button>
<div class="h-pill" onclick="togOv('setOv')"><div class="h-pav" id="hAv">?</div><span id="hNm">Kullanıcı</span></div>
</div>
</header>

<div class="main">
<!-- SOL -->
<aside class="sb-l" id="sbL">
<div class="sb-cat">Sesli Odalar</div>
<div id="vRooms"></div>
<div class="sb-cat" style="margin-top:8px">Yazılı Sohbet</div>
<div id="tRooms"></div>
</aside>

<!-- ORTA -->
<main class="chat">
<div class="ch-hdr">
<div class="ch-title"><i class="fas fa-volume-high"></i><span id="rmName">Genel Oda</span><div class="live-badge" id="liveB"><i class="fas fa-circle"></i> CANLI</div></div>
<div class="ch-acts">
<button onclick="joinVoice()" title="Sesli Katıl"><i class="fas fa-microphone"></i></button>
<button onclick="toast('Odadan ayrıldın','err')"><i class="fas fa-right-from-bracket"></i></button>
</div>
</div>
<div class="msgs" id="msgBox"></div>
<div class="ch-ft">
<div class="in-row">
<div class="in-wrap">
<button onclick="toast('Yakında','ok')"><i class="far fa-face-smile"></i></button>
<textarea class="m-inp" id="msgInp" placeholder="Mesajınızı yazın..." rows="1"></textarea>
<button onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button>
</div>
<button class="ptt" id="pttBtn" onmousedown="pttOn()" onmouseup="pttOff()" onmouseleave="pttOff()" ontouchstart="pttOn()" ontouchend="pttOff()">
<i class="fas fa-microphone"></i><span class="ptt-t">Bas Konuş</span>
<div class="ptt-w"><span></span><span></span><span></span></div>
</button>
</div>
</div>
</main>

<!-- SAĞ -->
<aside class="sb-r" id="sbR">
<div class="sr-hdr">Odadaki Kişiler <span id="onC">0</span></div>
<div class="u-list" id="uList"></div>
</aside>
</div>
</div>

<script>
/* =====================================================================
   1. MOCK API KATMANI (Vercel/Glitch'de index.js / messages.js ile değiştirilecek)
   ===================================================================== */
const API = {
    async getMessages(roomId) {
        // GERÇEK: return fetch(`/api/messages?room=${roomId}`).then(r=>r.json());
        return new Promise(r => setTimeout(() => r(DB.msgs.filter(m => m.room === roomId)), 150));
    },
    async sendMessage(roomId, text, user) {
        // GERÇEK: return fetch('/api/messages', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({room:roomId, text, user})}).then(r=>r.json());
        const n = { id: Date.now(), room: roomId, user, text, time: getT() };
        DB.msgs.push(n); return n;
    },
    async getUsers(roomId) {
        // GERÇEK: return fetch(`/api/users?room=${roomId}`).then(r=>r.json());
        return new Promise(r => setTimeout(() => r(DB.users), 200));
    },
    async joinRoom(roomId, userName) {
        // GERÇEK: return fetch('/api/join', {method:'POST', body:JSON.stringify({room:roomId, user:userName})});
        if(!DB.users.find(u=>u.id===userName)) DB.users.push({id:userName, name:userName, status:'on', speaking:false, room:roomId});
        return {ok:true};
    }
};

/* =====================================================================
   2. VERİTABANI SIMÜLASYONU (messages.js verileri)
   ===================================================================== */
const DB = {
    users: [
        {id:'u1',name:'Ahmet',status:'on',speaking:true,room:'genel'},
        {id:'u2',name:'Mehmet',status:'on',speaking:false,room:'genel'},
        {id:'u3',name:'Ali',status:'idle',speaking:false,room:'genel'},
        {id:'u4',name:'Ayşe',status:'on',speaking:true,room:'genel'},
        {id:'u5',name:'Fatma',status:'off',speaking:false,room:'genel'},
        {id:'u6',name:'Burak',status:'on',speaking:false,room:'genel'}
    ],
    msgs: [
        {id:1,room:'genel',user:'Sistem',text:'Odaya hoş geldiniz. Saygılı olun.',time:'12:00',sys:true},
        {id:2,room:'genel',user:'Ahmet',text:'Selamlar millet',time:'12:01',voice:true},
        {id:3,room:'genel',user:'Ayşe',text:'İyi akşamlar, sesim açık mı?',time:'12:02',voice:true},
        {id:4,room:'genel',user:'Mehmet',text:'Evet açık duyuyoruz net bir şekilde',time:'12:03'},
        {id:5,room:'genel',user:'Ali',text:'Ben biraz afk olacağım dönerim',time:'12:05'}
    ],
    rooms: [
        {id:'genel',name:'Genel Oda',type:'voice',c:12},
        {id:'rastgele',name:'Rastgele Sohbet',type:'voice',c:8},
        {id:'muzik',name:'Müzik Odası',type:'voice',c:4},
        {id:'oyun',name:'Oyun Odaları',type:'voice',c:6},
        {id:'y1',name:'Yazılı Sohbet',type:'text',c:15},
        {id:'y2',name:'Hobi & İlgi Alanları',type:'text',c:9}
    ]
};

/* =====================================================================
   3. WEBRTC ISKELETİ (Gerçek Sunucu - index.js ile çalışır)
   ===================================================================== */
let localStream = null, peers = {}, isInVoice = false;
const rtcConf = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

async function initWebRTC() {
    try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        toast('Mikrofon bağlandı', 'ok');
        // Gerçek senaryoda Socket.io ile odadaki herkese signaling başlar:
        // socket.emit('join-voice', { room: S.room });
        // socket.on('offer', (data) => handleOffer(data));
        // socket.on('answer', (data) => handleAnswer(data));
        // socket.on('ice-candidate', (data) => handleIce(data));
    } catch(e) { toast('Mikrofon hatası!', 'err'); console.error(e); }
}

function createPC(targetId) {
    const pc = new RTCPeerConnection(rtcConf);
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    pc.onicecandidate = e => { if(e.candidate) /* socket.emit('ice', {target: targetId, candidate: e.candidate}) */ };
    pc.ontrack = e => { const u = DB.users.find(x=>x.id===targetId); if(u) u.speaking = true; renderU(); };
    peers[targetId] = pc; return pc;
}

/* =====================================================================
   4. UYGULAMA STATE VE CORE
   ===================================================================== */
const S = { user: null, room: 'genel', connected: false };
const COLS = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22'];
function getCol(n){ let h=0; for(let i=0;i<n.length;i++) h=n.charCodeAt(i)+((h<<5)-h); return COLS[Math.abs(h)%COLS.length]; }
function getT(){ const d=new Date(); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }

async function doLogin() {
    const n = document.getElementById('nickInp').value.trim();
    if(n.length < 2) return;
    S.user = { id: 'u_'+Date.now(), name: n };
    S.connected = true;
    document.getElementById('hAv').textContent = n[0].toUpperCase();
    document.getElementById('hNm').textContent = n;
    await API.joinRoom(S.room, S.user.name);
    await load();
    togOv('loginOv'); document.getElementById('app').classList.remove('hide');
    poll(); toast('Odaya bağlandın', 'ok');
}

async function load() {
    DB.users = await API.getUsers(S.room);
    renderR(); renderU(); renderM();
}

function poll() { setInterval(async () => { if(!S.connected) return; await load(); simVoice(); }, 3000); }

function joinVoice() {
    if(isInVoice) { isInVoice=false; document.getElementById('liveB').classList.remove('on'); if(localStream) localStream.getTracks().forEach(t=>t.stop()); toast('Sesli odadan ayrıldın','err'); }
    else { isInVoice=true; document.getElementById('liveB').classList.add('on'); initWebRTC(); }
}

function doLogout() { S.connected=false; if(localStream) localStream.getTracks().forEach(t=>t.stop()); togOv('setOv'); document.getElementById('app').classList.add('hide'); document.getElementById('loginOv').classList.add('on'); document.getElementById('nickInp').value=''; }

/* =====================================================================
   5. PTT VE MESAJ
   ===================================================================== */
function pttOn() {
    if(!isInVoice || !localStream) { toast('Önce mikrofonu aç (üst bardaki mikrofon ikonuna tıkla)','err'); return; }
    document.getElementById('pttBtn').classList.add('on');
    const me = DB.users.find(u=>u.id===S.user.name); if(me) me.speaking=true; renderU();
}
function pttOff() { document.getElementById('pttBtn').classList.remove('on'); const me = DB.users.find(u=>u.id===S.user.name); if(me) me.speaking=false; renderU(); }
document.addEventListener('mouseup', ()=>{ if(document.getElementById('pttBtn').classList.contains('on')) pttOff(); });
document.addEventListener('touchend', ()=>{ if(document.getElementById('pttBtn').classList.contains('on')) pttOff(); });

async function sendMsg() {
    const inp = document.getElementById('msgInp'), t = inp.value.trim();
    if(!t || !S.user) return; inp.value=''; inp.style.height='auto';
    await API.sendMessage(S.room, t, S.user.name); renderM();
    if(Math.random()>.4) {
        setTimeout(async()=>{
            const nm=DB.users.map(u=>u.name).filter(n=>n!==S.user.name);
            const ru=nm[Math.floor(Math.random()*nm.length)];
            const rp=['Selam!','Nasılsın?','Akşama gelecek misin?','Tamam','Mic açık mı?','Duyulmuyor biraz','Evet buradayım'];
            await API.sendMessage(S.room, rp[Math.floor(Math.random()*rp.length)], ru); renderM();
        }, 1000+Math.random()*2000);
    }
}

document.addEventListener('DOMContentLoaded', ()=>{
    document.getElementById('msgInp').addEventListener('keydown', e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()} });
    document.getElementById('msgInp').addEventListener('input', function(){ this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,60)+'px'; });
    document.getElementById('nickInp').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
});

/* =====================================================================
   6. RENDER
   ===================================================================== */
function renderR() {
    document.getElementById('vRooms').innerHTML = DB.rooms.filter(r=>r.type==='voice').map(r=>`<button class="r-item ${S.room===r.id?'act':''}" onclick="swRoom('${r.id}')"><i class="fas fa-volume-high" style="color:var(--green)"></i>${r.name}<span class="rb">${r.c}</span></button>`).join('');
    document.getElementById('tRooms').innerHTML = DB.rooms.filter(r=>r.type==='text').map(r=>`<button class="r-item ${S.room===r.id?'act':''}" onclick="swRoom('${r.id}')"><i class="fas fa-hashtag"></i>${r.name}<span class="rb">${r.c}</span></button>`).join('');
}

function renderM() {
    const box = document.getElementById('msgBox'); let h='';
    DB.msgs.filter(m=>m.room===S.room).forEach(m => {
        if(m.sys) { h+=`<div class="msg-sys"><span>${m.text}</span></div>`; return; }
        const me = m.user===(S.user?S.user.name:'');
        const c = getCol(m.user); const vc = m.voice ? `<span class="voice-tag"><i class="fas fa-microphone"></i> Sesli</span>` : '';
        h+=`<div class="msg ${me?'me':''}">
            <div class="m-av" style="background:${c}">${m.user[0].toUpperCase()}</div>
            <div class="m-body">
                <div class="m-head"><span class="m-name" style="color:${c}">${m.user}</span>${vc}<span class="m-time">${m.time}</span></div>
                <div class="m-txt">${m.text}</div>
            </div>
        </div>`;
    });
    box.innerHTML=h; box.scrollTop=box.scrollHeight;
}

function renderU() {
    const on = DB.users.filter(u=>u.status!=='off');
    document.getElementById('onC').textContent = on.length;
    document.getElementById('uList').innerHTML = DB.users.map(u => {
        const c=getCol(u.name); const mic = u.speaking ? `<i class="fas fa-microphone mic-on"></i> Konuşuyor` : (u.status==='on'?'Çevrimiçi':u.status==='idle'?'AFK':'Çevrimdışı');
        return `<div class="u-it"><div class="u-aw"><div class="u-av" style="background:${c}">${u.name[0].toUpperCase()}</div><div class="u-dot ${u.status}"></div></div><div class="u-inf"><div class="u-nm">${u.name}</div><div class="u-st">${mic}</div></div></div>`;
    }).join('');
}

/* =====================================================================
   7. YARDIMCILAR
   ===================================================================== */
async function swRoom(id) { S.room=id; document.getElementById('rmName').textContent = DB.rooms.find(r=>r.id===id).name; await load(); closePn(); }
function simVoice() { DB.users.forEach(u=>{ if(u.id!==S.user?.name) u.speaking = Math.random()>.8; }); renderU(); }
function togOv(id) { document.getElementById(id).classList.toggle('on'); }
function togPn(s) { document.getElementById(s==='l'?'sbL':'sbR').classList.toggle('on'); document.getElementById('mobOv').classList.toggle('on'); }
function closePn() { document.getElementById('sbL').classList.remove('on'); document.getElementById('sbR').classList.remove('on'); document.getElementById('mobOv').classList.remove('on'); }
function toast(m,t='info') { const b=document.getElementById('tBox'), d=document.createElement('div'); d.className='t-it '+t; d.innerHTML=`<i class="fas fa-${t==='ok'?'check-circle':t==='err'?'times-circle':'info-circle'}" style="color:var(--${t==='ok'?'green':t==='err'?'red':'primary'})"></i>${m}`; b.appendChild(d); setTimeout(()=>{d.style.opacity='0';d.style.transform='translateX(50px)';d.style.transition='.3s';setTimeout(()=>d.remove(),300)},3000); }
</script>
</body>
