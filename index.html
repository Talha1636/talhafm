<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SesliChat Pro - Full Suite</title>
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
:root{--bg-0:#0c0e12;--bg-1:#13161c;--bg-2:#1a1e26;--bg-3:#232830;--primary:#2979ff;--primary-dim:rgba(41,121,255,.15);--green:#00e676;--green-dim:rgba(0,230,118,.15);--red:#ff5252;--red-dim:rgba(255,82,82,.15);--orange:#ffab40;--txt:#e0e0e0;--txt2:#9e9e9e;--txt3:#616161;--bdr:#1e222a;--radius:4px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg-0);color:var(--txt);font-size:13px}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg-1)}::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:3px}
input,textarea,button{font-family:inherit;outline:none;border:none;background:none;color:var(--txt)}

/* LOGIN */
.login-ov{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);z-index:9999;display:flex;align-items:center;justify-content:center;transition:.3s}
.login-ov.hide{opacity:0;pointer-events:none}
.login-box{background:var(--bg-1);border:1px solid var(--bdr);padding:32px;width:320px;text-align:center}
.login-box h1{color:var(--primary);font-size:20px;margin-bottom:8px}
.login-box p{color:var(--txt2);font-size:12px;margin-bottom:24px}
.login-inp{width:100%;padding:12px;background:var(--bg-2);border:1px solid var(--bdr);border-radius:var(--radius);color:var(--txt);font-size:14px;margin-bottom:16px;text-align:center}
.login-inp:focus{border-color:var(--primary)}
.login-btn{width:100%;padding:12px;background:var(--primary);color:#fff;border-radius:var(--radius);font-weight:700;cursor:pointer;transition:.2s}
.login-btn:hover{background:#1565c0}

/* LAYOUT */
.app{display:grid;grid-template-columns:160px 1fr 200px;height:100vh}
.header{grid-column:1/-1;height:42px;background:var(--bg-1);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:10}
.h-left{display:flex;align-items:center;gap:12px}
.h-logo{font-weight:700;color:var(--primary);font-size:14px}
.h-room{color:var(--txt2);font-size:13px;font-weight:600}
.h-right{display:flex;align-items:center;gap:10px}
.h-btn{width:30px;height:30px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:var(--txt2);cursor:pointer;font-size:13px;transition:.15s}
.h-btn:hover{background:var(--bg-3);color:var(--txt)}
.h-btn.active-mic{color:var(--green);background:var(--green-dim)}
.h-nick{font-size:12px;font-weight:600;color:var(--txt2);background:var(--bg-2);padding:4px 10px;border-radius:12px}
.h-mob{display:none}

/* PANELS */
.panel-l{background:var(--bg-1);border-right:1px solid var(--bdr);overflow-y:auto;padding-bottom:20px}
.panel-r{background:var(--bg-1);border-left:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden}
.p-title{padding:12px 12px 8px;font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:1px}
.room-btn{width:calc(100% - 16px);margin:1px 8px;padding:8px 10px;border-radius:var(--radius);font-size:12px;font-weight:500;color:var(--txt2);display:flex;align-items:center;gap:8px;cursor:pointer;transition:.15s}
.room-btn:hover{background:var(--bg-2);color:var(--txt)}
.room-btn.active{background:var(--bg-3);color:var(--txt);font-weight:600}
.room-btn i{font-size:11px;width:14px;text-align:center}
.room-count{margin-left:auto;background:var(--red);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px;font-weight:700}

/* CHAT */
.chat-area{display:flex;flex-direction:column;background:var(--bg-0);overflow:hidden}
.msg-container{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:3px}
.msg-row{padding:2px 4px;border-radius:var(--radius);display:flex;gap:8px;line-height:1.4}
.msg-row:hover{background:rgba(255,255,255,.02)}
.msg-row.self{flex-direction:row-reverse}
.msg-meta{white-space:nowrap;font-size:12px}
.msg-nick{font-weight:700;cursor:pointer}
.msg-time{color:var(--txt3);margin-left:6px;font-size:11px}
.msg-txt{color:var(--txt);word-break:break-word;white-space:pre-wrap}
.msg-row.self .msg-txt{color:var(--primary)}
.msg-whisper{color:var(--orange);font-style:italic}
.msg-sys{text-align:center;padding:6px 0;color:var(--txt3);font-size:11px;background:none}
.msg-private-tag{font-size:9px;background:var(--orange);color:#000;padding:1px 4px;border-radius:3px;margin-left:6px;font-weight:700;vertical-align:middle}

/* INPUT BAR */
.input-bar{padding:10px;background:var(--bg-1);border-top:1px solid var(--bdr);display:flex;align-items:flex-end;gap:8px}
.in-box{flex:1;background:var(--bg-2);border:1px solid var(--bdr);border-radius:var(--radius);display:flex;align-items:center;padding:0 8px;transition:.2s}
.in-box:focus-within{border-color:var(--primary)}
.in-box button{padding:8px;color:var(--txt3);cursor:pointer;font-size:14px}
.in-box button:hover{color:var(--txt)}
.chat-inp{flex:1;background:transparent;border:none;color:var(--txt);padding:8px 4px;resize:none;max-height:60px;font-size:13px}
.chat-inp::placeholder{color:var(--txt3)}
.send-btn{padding:0 14px;height:36px;background:var(--primary);color:#fff;border-radius:var(--radius);font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px;flex-shrink:0}
.mic-toggle{width:36px;height:36px;background:var(--bg-3);border-radius:var(--radius);color:var(--txt2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s}
.mic-toggle:hover{background:var(--bg-2)}
.mic-toggle.on{background:var(--green);color:#fff;box-shadow:0 0 10px rgba(0,230,118,.3)}

/* RIGHT USERS */
.u-header{padding:12px;border-bottom:1px solid var(--bdr);font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;display:flex;justify-content:space-between}
.u-header span{background:var(--bg-3);padding:1px 6px;border-radius:8px;color:var(--txt2);font-size:9px}
.u-scroll{flex:1;overflow-y:auto;padding:6px 0}
.u-item{display:flex;align-items:center;gap:8px;padding:6px 12px;cursor:pointer;transition:.15s;position:relative}
.u-item:hover{background:var(--bg-2)}
.u-item:hover .u-actions{opacity:1;pointer-events:auto}
.u-av{width:28px;height:28px;border-radius:50%;background:var(--bg-3);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--txt);position:relative;flex-shrink:0}
.u-dot{position:absolute;bottom:-1px;right:-1px;width:9px;height:9px;border-radius:50%;border:2px solid var(--bg-1)}
.u-dot.on{background:var(--green)} .u-dot.off{background:var(--txt3)}
.u-info{min-width:0;flex:1}
.u-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-status{font-size:10px;color:var(--txt3);display:flex;align-items:center;gap:4px}
.u-status i{font-size:8px}
.u-status.mic-on i{color:var(--green)}
.speaking-pulse{animation:sp 1s infinite}
@keyframes sp{0%,100%{opacity:1}50%{opacity:.4}}
.u-actions{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;gap:4px;opacity:0;pointer-events:none;transition:.2s;background:var(--bg-3);padding:2px;border-radius:var(--radius);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.u-actions button{width:24px;height:24px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--txt2);cursor:pointer}
.u-actions button:hover{background:var(--bg-2);color:var(--txt)}

/* MODALS (ÖZEL MESAJ / ARAMALAR) */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.2s}
.modal-ov.show{opacity:1;pointer-events:auto}
.modal-box{background:var(--bg-1);border:1px solid var(--bdr);border-radius:var(--radius);width:400px;max-width:95vw;height:500px;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.6);transform:translateY(20px);transition:.2s}
.modal-ov.show .modal-box{transform:translateY(0)}
.modal-hdr{height:40px;background:var(--bg-2);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0}
.modal-hdr span{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.modal-hdr button{color:var(--txt2);font-size:16px;cursor:pointer}
.modal-body{flex:1;display:flex;flex-direction:column;overflow:hidden}
#privMsgBox{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:4px}
.priv-input{padding:8px;border-top:1px solid var(--bdr);display:flex;gap:8px;background:var(--bg-1)}
.priv-input input{flex:1;background:var(--bg-2);border:1px solid var(--bdr);border-radius:var(--radius);padding:8px;color:var(--txt);font-size:12px}
.priv-input input:focus{border-color:var(--primary)}

/* CALL OVERLAY (VIDEO / SESLİ) */
.call-ov{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.3s}
.call-ov.show{opacity:1;pointer-events:auto}
.call-ov video{width:80%;max-width:600px;max-height:400px;background:#000;border-radius:8px;border:2px solid var(--bdr);margin-bottom:20px;object-fit:cover}
.call-remote-info{color:#fff;font-size:20px;font-weight:700;margin-bottom:20px}
.call-actions{display:flex;gap:16px}
.call-actions button{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:.2s;color:#fff}
.call-btn-end{background:var(--red)}
.call-btn-mute{background:var(--bg-3)}
.call-btn-cam{background:var(--bg-3)}
.call-actions button:hover{transform:scale(1.1)}

/* TOAST */
.toast-wrap{position:fixed;top:50px;right:12px;z-index:5000;display:flex;flex-direction:column;gap:6px}
.toast{background:var(--bg-3);border:1px solid var(--bdr);padding:10px 14px;border-radius:var(--radius);font-size:12px;display:flex;align-items:center;gap:8px;animation:tIn .3s forwards;border-left:3px solid var(--primary)}
.toast.ok{border-left-color:var(--green)}.toast.err{border-left-color:var(--red)}
@keyframes tIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

.mob-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}
@media(max-width:768px){
    .app{grid-template-columns:1fr}
    .panel-l,.panel-r{position:fixed;top:42px;bottom:0;width:260px;z-index:50;background:var(--bg-1);transform:translateX(-100%);transition:.2s}
    .panel-r{right:0;left:auto;transform:translateX(100%)}
    .panel-l.open,.panel-r.open{transform:translateX(0)}
    .h-mob{display:flex}
    .mob-overlay.show{display:block}
    .modal-box{width:100%;height:100%;max-width:100vw;border-radius:0}
    .call-ov video{width:95%}
}
</style>
</head>
<body>

<div class="toast-wrap" id="toasts"></div>
<div class="mob-overlay" id="mobOv" onclick="closeMob()"></div>

<!-- GİRİŞ -->
<div class="login-ov" id="loginOv">
<div class="login-box">
    <h1><i class="fas fa-comments"></i> SesliChat Pro</h1>
    <p>Sesli, Görüntülü ve Özel Mesaj sistemi</p>
    <input type="text" class="login-inp" id="nickInp" placeholder="Kullanıcı adınız" maxlength="15">
    <button class="login-btn" id="loginBtn">Sohbete Katıl</button>
</div>
</div>

<!-- ANA UYGULAMA -->
<div class="app" id="appUI" style="display:none">
    <header class="header">
        <div class="h-left">
            <button class="h-btn h-mob" id="mobMenuBtn"><i class="fas fa-bars"></i></button>
            <div class="h-logo">SesliChat</div>
            <div class="h-room"># genel</div>
        </div>
        <div class="h-right">
            <button class="h-btn h-mob" id="mobUsersBtn"><i class="fas fa-users"></i></button>
            <div class="h-nick" id="hNick">Kullanıcı</div>
            <button class="h-btn" id="hMicBtn" title="Mikrofonu Aç/Kapat"><i class="fas fa-microphone-slash"></i></button>
            <button class="h-btn" onclick="location.reload()" title="Çıkış"><i class="fas fa-right-from-bracket"></i></button>
        </div>
    </header>

    <aside class="panel-l" id="panelL">
        <div class="p-title">Odalar</div>
        <button class="room-btn active"><i class="fas fa-hashtag"></i> genel <span class="room-count" id="roomC">0</span></button>
        <button class="room-btn"><i class="fas fa-hashtag"></i> sohbet</button>
        <button class="room-btn"><i class="fas fa-hashtag"></i> müzik</button>
        <button class="room-btn"><i class="fas fa-hashtag"></i> oyun</button>
    </aside>

    <main class="chat-area">
        <div class="msg-container" id="msgBox"></div>
        <div class="input-bar">
            <div class="in-box">
                <button><i class="far fa-face-smile"></i></button>
                <textarea class="chat-inp" id="msgInp" placeholder="Mesaj yazın... (Özel için: /whisper nick mesaj)" rows="1"></textarea>
            </div>
            <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
            <button class="mic-toggle" id="micToggle" title="Mikrofon Toggle"><i class="fas fa-microphone-slash"></i></button>
        </div>
    </main>

    <aside class="panel-r" id="panelR">
        <div class="u-header">Çevrimiçi <span id="onC">0</span></div>
        <div class="u-scroll" id="uList"></div>
    </aside>
</div>

<!-- ÖZEL MESAJ MODALI -->
<div class="modal-ov" id="privModal">
<div class="modal-box">
    <div class="modal-hdr">
        <span><i class="fas fa-lock" style="color:var(--orange)"></i> <span id="privUserName">Kullanıcı</span></span>
        <button onclick="closePriv()"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="modal-body">
        <div id="privMsgBox"></div>
        <div class="priv-input">
            <input type="text" id="privInp" placeholder="Gizli mesaj gönder...">
            <button class="send-btn" id="privSendBtn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>
</div>

<!-- ARAMA EKRANI (SESLİ / GÖRÜNTÜLÜ) -->
<div class="call-ov" id="callOv">
    <div class="call-remote-info" id="callRemoteName">Kullanıcı</div>
    <video id="remoteVideo" autoplay playsinline></video>
    <div class="call-actions">
        <button class="call-btn-mute" id="callMuteBtn" onclick="toggleCallMic()"><i class="fas fa-microphone"></i></button>
        <button class="call-btn-cam" id="callCamBtn" onclick="toggleCallCam()" style="display:none"><i class="fas fa-video"></i></button>
        <button class="call-btn-end" onclick="endCall()"><i class="fas fa-phone-slash"></i></button>
    </div>
</div>

<script>
/* =====================================================================
   RENDE.COM BACKEND URL'Sİ BURAYA
   ===================================================================== */
const SERVER_URL = "https://talhafm.onrender.com";

let socket = null;
let localStream = null; // Ana odadaki mikrofon
let peers = {}; // Ana oda peer bağlantıları
let mySocketId = null;
let myName = "";
let isMicActive = false;

// ÖZEL MESAJ VE ARAMA DEĞİŞKENLERİ
let activePrivUser = null; 
let callPeer = null; // Karşı tarafın PeerConnection'ı
let localCallStream = null; // Arama sırasındaki kameram+mikrofonum
let isCallMuted = false;
let isCamOff = false;
let isVideoCall = false;

const COLS = ['#e57373','#64b5f6','#81c784','#ffb74d','#ba68c8','#4dd0e1','#ff8a65','#a1887f'];
function getCol(n) { let h=0; for(let i=0;i<n.length;i++) h=n.charCodeAt(i)+((h<<5)-h); return COLS[Math.abs(h)%COLS.length]; }

function toast(m, t="info") {
    const b = document.getElementById('toasts'); const d = document.createElement('div'); d.className = `toast ${t}`;
    const ic = t==='ok'?'check-circle':(t==='err'?'times-circle':'info-circle');
    const cl = t==='ok'?'green':(t==='err'?'red':'primary');
    d.innerHTML = `<i class="fas fa-${ic}" style="color:var(--${cl})"></i>${m}`; b.appendChild(d);
    setTimeout(() => { d.style.opacity='0'; d.style.transition='.3s'; setTimeout(()=>d.remove(), 300); }, 3000);
}

function closeMob() { document.getElementById('panelL').classList.remove('open'); document.getElementById('panelR').classList.remove('open'); document.getElementById('mobOv').classList.remove('show'); }

/* =====================================================================
   1. GİRİŞ VE ANA ODA WEBRTC
   ===================================================================== */
async function handleLogin() {
    myName = document.getElementById('nickInp').value.trim();
    if (myName.length < 2) return toast("Geçerli bir isim girin.", "err");

    try {
        socket = io(SERVER_URL, { transports: ['websocket', 'polling'], timeout: 5000 });

        socket.on('connect', () => {
            mySocketId = socket.id;
            socket.emit('login', myName);
            document.getElementById('loginOv').classList.add('hide');
            document.getElementById('appUI').style.display = 'grid';
            document.getElementById('hNick').textContent = myName;
            toast("Bağlandı.", "ok");
            initMainRoomWebRTC();
            initPrivateCallWebRTC();
        });

        socket.on('disconnect', () => toast("Bağlantı koptu.", "err"));

        // ANA ODA EVENTLARI
        socket.on('user_list', (users) => renderUsers(users));
        socket.on('user_joined', (user) => addUserToUI(user));
        socket.on('user_left', (data) => removeUserFromUI(data.id));
        socket.on('system_msg', (data) => appendMsg({ user: 'Sistem', text: data.text, sys: true }));
        socket.on('new_msg', (msg) => appendMsg(msg));
        socket.on('user_mic_update', (data) => updateMicUI(data.id, data.micOn));
        socket.on('user_speaking_update', (data) => updateSpeakingUI(data.id, data.isSpeaking));

        // ÖZEL MESAJ EVENTLARI
        socket.on('priv_msg', (data) => {
            if (activePrivUser === data.from) {
                appendPrivMsg(data.from, data.text, false);
            } else {
                toast(`${data.from} size özel mesaj gönderdi.`, "ok");
            }
        });

    } catch(err) { toast("Sunucuya ulaşılamıyor.", "err"); }
}

/* --- ANA ODA WEBRTC --- */
function initMainRoomWebRTC() {
    socket.on('new_peer', (data) => { if (isMicActive && localStream) createMainPeer(data.senderId, true); });
    socket.on('offer', (data) => { if (isMicActive && localStream) handleMainOffer(data); });
    socket.on('answer', (data) => { if(peers[data.senderId]) peers[data.senderId].setRemoteDescription(new RTCSessionDescription(data.answer)).catch(e=>console.error(e)); });
    socket.on('ice_candidate', (data) => { if(peers[data.senderId]) peers[data.senderId].addIceCandidate(new RTCIceCandidate(data.candidate)).catch(e=>console.error(e)); });
}

function createMainPeer(targetId, isInitiator) {
    if (peers[targetId]) return;
    const pc = new RTCPeerConnection({iceServers: [{urls: 'stun:stun.l.google.com:19302'}]});
    peers[targetId] = pc;
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    
    const audio = new Audio(); audio.autoplay = true;
    pc.ontrack = (e) => { audio.srcObject = e.streams[0]; };
    pc.onconnectionstatechange = () => { if(pc.connectionState==='disconnected'||pc.connectionState==='failed') delete peers[targetId]; };
    pc.onicecandidate = (e) => { if(e.candidate) socket.emit('ice_candidate', {targetId, candidate: e.candidate}); };

    if (isInitiator) {
        pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => socket.emit('offer', {targetId, offer: pc.localDescription})).catch(e=>console.error(e));
    }
}

function handleMainOffer(data) {
    const pc = new RTCPeerConnection({iceServers: [{urls: 'stun:stun.l.google.com:19302'}]});
    peers[data.senderId] = pc;
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    const audio = new Audio(); audio.autoplay = true;
    pc.ontrack = (e) => { audio.srcObject = e.streams[0]; };
    pc.onicecandidate = (e) => { if(e.candidate) socket.emit('ice_candidate', {targetId: data.senderId, candidate: e.candidate}); };
    pc.setRemoteDescription(new RTCSessionDescription(data.offer)).then(() => pc.createAnswer()).then(a => pc.setLocalDescription(a)).then(() => socket.emit('answer', {targetId: data.senderId, answer: pc.localDescription})).catch(e=>console.error(e));
}

async function toggleMic() {
    if (!socket) return;
    if (isMicActive) {
        isMicActive = false; if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null;} for(let id in peers){peers[id].close();delete peers[id];}
        document.getElementById('micToggle').classList.remove('on'); document.getElementById('micToggle').innerHTML='<i class="fas fa-microphone-slash"></i>';
        document.getElementById('hMicBtn').classList.remove('active-mic'); document.getElementById('hMicBtn').innerHTML='<i class="fas fa-microphone-slash"></i>';
        socket.emit('toggle_mic', false); socket.emit('speaking_status', false); toast("Mikrofon kapalı.","err");
    } else {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({audio:true,video:false}); isMicActive = true;
            document.getElementById('micToggle').classList.add('on'); document.getElementById('micToggle').innerHTML='<i class="fas fa-microphone"></i>';
            document.getElementById('hMicBtn').classList.add('active-mic'); document.getElementById('hMicBtn').innerHTML='<i class="fas fa-microphone"></i>';
            socket.emit('toggle_mic', true); socket.emit('join_voice_net'); toast("Mikrofon açık.","ok"); startSpeakingDetection();
        } catch(e) { toast("Mikrofon hatası!","err"); }
    }
}

function startSpeakingDetection() {
    if(!localStream)return; const ctx=new (window.AudioContext||window.webkitAudioContext)(); const an=ctx.createAnalyser(); const src=ctx.createMediaStreamSource(localStream); src.connect(an); an.fftSize=512; const d=new Uint8Array(an.frequencyBinCount); let sp=false;
    function det(){if(!isMicActive)return; an.getByteFrequencyData(d); let s=0; for(let i=0;i<d.length;i++)s+=d[i]; let a=s/d.length; if(a>15&&!sp){sp=true;socket.emit('speaking_status',true);}else if(a<=15&&sp){sp=false;socket.emit('speaking_status',false);} requestAnimationFrame(det);} det();
}

/* =====================================================================
   2. ÖZEL MESAJ (WHISPER) SİSTEMİ
   ===================================================================== */
function openPrivChat(targetName) {
    activePrivUser = targetName;
    document.getElementById('privUserName').textContent = targetName;
    document.getElementById('privMsgBox').innerHTML = '';
    document.getElementById('privModal').classList.add('show');
}

function closePriv() { document.getElementById('privModal').classList.remove('show'); activePrivUser = null; }

function sendPrivMsg() {
    const inp = document.getElementById('privInp'); const text = inp.value.trim();
    if (!text || !activePrivUser || !socket) return;
    socket.emit('priv_msg', { to: activePrivUser, text: text });
    appendPrivMsg(myName, text, true); inp.value = '';
}

function appendPrivMsg(user, text, isMe) {
    const box = document.getElementById('privMsgBox');
    const color = getCol(user);
    box.innerHTML += `<div class="msg-row ${isMe?'self':''}" style="background:var(--bg-2);padding:8px;border-radius:var(--radius);margin-bottom:4px">
        <span class="msg-nick" style="color:${color}">${user}:</span> <span class="msg-txt" style="color:${isMe?'var(--primary)':'var(--txt)'}">${text}</span>
    </div>`;
    box.scrollTop = box.scrollHeight;
}

/* =====================================================================
   3. SESLİ & GÖRÜNTÜLÜ ARAMA SİSTEMI (WEBRTC)
   ===================================================================== */
function initPrivateCallWebRTC() {
    // Arama teklifleri
    socket.on('call_offer', async (data) => {
        const confirmCall = confirm(`${data.from} sizinle ${data.isVideo ? 'görüntülü' : 'sesli'} arama yapıyor. Kabul ediyor musunuz?`);
        if (confirmCall) {
            try {
                localCallStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: data.isVideo });
                setupCallUI(data.from, data.isVideo);
                
                callPeer = new RTCPeerConnection({iceServers: [{urls: 'stun:stun.l.google.com:19302'}]});
                localCallStream.getTracks().forEach(t => callPeer.addTrack(t, localCallStream));
                
                document.getElementById('remoteVideo').srcObject = new MediaStream();
                callPeer.ontrack = (e) => { document.getElementById('remoteVideo').srcObject = e.streams[0]; };
                
                callPeer.onicecandidate = (e) => { if(e.candidate) socket.emit('call_ice', {targetId: data.from, candidate: e.candidate}); };
                
                await callPeer.setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await callPeer.createAnswer();
                await callPeer.setLocalDescription(answer);
                socket.emit('call_answer', {targetId: data.from, answer: callPeer.localDescription});
            } catch(e) { toast("Arama reddedildi/kamera hatası.","err"); socket.emit('call_reject', {targetId: data.from}); }
        } else {
            socket.emit('call_reject', {targetId: data.from});
        }
    });

    socket.on('call_answer', (data) => { if(callPeer) callPeer.setRemoteDescription(new RTCSessionDescription(data.answer)).catch(e=>console.error(e)); });
    socket.on('call_ice', (data) => { if(callPeer) callPeer.addIceCandidate(new RTCIceCandidate(data.candidate)).catch(e=>console.error(e)); });
    socket.on('call_reject', () => { toast("Arama reddedildi.","err"); endCall(); });
    socket.on('call_end', () => { toast("Arama sonlandı.","err"); endCall(); });
}

async function startCall(targetName, isVideo) {
    if (callPeer) return toast("Zaten bir aramadaysınız.","err");
    try {
        localCallStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideo });
        setupCallUI(targetName, isVideo);
        
        // Karşı tarafın socket id'sini bul (UI üzerinden)
        const targetEl = document.querySelector(`.u-item:hover .u-name`); // Basit eşleşme
        // Sunucuya hedef isimle offer gönderiyoruz (Backend'de name -> socket.id mapping yapılmalı)
        // Şimdilik doğrudan emit ediyoruz.
        
        callPeer = new RTCPeerConnection({iceServers: [{urls: 'stun:stun.l.google.com:19302'}]});
        localCallStream.getTracks().forEach(t => callPeer.addTrack(t, localCallStream));
        
        document.getElementById('remoteVideo').srcObject = new MediaStream();
        callPeer.ontrack = (e) => { document.getElementById('remoteVideo').srcObject = e.streams[0]; };
        
        callPeer.onicecandidate = (e) => { if(e.candidate) socket.emit('call_ice', {targetName: targetName, candidate: e.candidate}); };

        const offer = await callPeer.createOffer();
        await callPeer.setLocalDescription(offer);
        socket.emit('call_offer', {targetName: targetName, offer: callPeer.localDescription, isVideo: isVideo});
        
    } catch(e) { toast("Kamera/Mikrofon izni verilmedi.","err"); }
}

function setupCallUI(name, isVideo) {
    isVideoCall = isVideo;
    document.getElementById('callRemoteName').textContent = name;
    document.getElementById('callOv').classList.add('show');
    document.getElementById('callCamBtn').style.display = isVideo ? 'flex' : 'none';
    if (!isVideo) document.getElementById('remoteVideo').style.display = 'none';
    else document.getElementById('remoteVideo').style.display = 'block';
}

function endCall() {
    document.getElementById('callOv').classList.remove('show');
    if (localCallStream) { localCallStream.getTracks().forEach(t => t.stop()); localCallStream = null; }
    if (callPeer) { callPeer.close(); callPeer = null; }
    socket.emit('call_end', {});
}

function toggleCallMic() {
    if (!localCallStream) return;
    isCallMuted = !isCallMuted;
    localCallStream.getAudioTracks()[0].enabled = !isCallMuted;
    document.getElementById('callMuteBtn').innerHTML = isCallMuted ? '<i class="fas fa-microphone-slash"></i>' : '<i class="fas fa-microphone"></i>';
    document.getElementById('callMuteBtn').style.background = isCallMuted ? 'var(--red)' : 'var(--bg-3)';
}

function toggleCallCam() {
    if (!localCallStream) return;
    isCamOff = !isCamOff;
    localCallStream.getVideoTracks()[0].enabled = !isCamOff;
    document.getElementById('callCamBtn').innerHTML = isCamOff ? '<i class="fas fa-video-slash"></i>' : '<i class="fas fa-video"></i>';
    document.getElementById('callCamBtn').style.background = isCamOff ? 'var(--red)' : 'var(--bg-3)';
}

/* =====================================================================
   4. UI RENDER FONKSİYONLARI
   ===================================================================== */
function sendMsg() {
    const inp = document.getElementById('msgInp'); let text = inp.value.trim();
    if (!text || !socket) return;
    
    // /whisper nick mesaj Formatı Kontrolü
    if (text.startsWith('/whisper ")) {
        const parts = text.substring(9).split(' ');
        const target = parts[0]; const msg = parts.slice(1).join(' ');
        if (target && msg) { socket.emit('priv_msg', {to: target, text: msg}); toast(`Özel mesaj gönderildi: ${target}`, "ok"); }
        else toast("Hatalı komut. Kullanım: /whisper nick mesaj", "err");
        inp.value = ''; return;
    }

    socket.emit('send_msg', {text}); inp.value = ''; inp.style.height = 'auto';
}

function appendMsg(m) {
    const box = document.getElementById('msgBox');
    if (m.sys) { box.innerHTML += `<div class="msg-sys">*** ${m.text} ***</div>`; }
    else {
        const isMe = m.user === myName; const c = getCol(m.user);
        box.innerHTML += `<div class="msg-row ${isMe?'self':''}"><div class="msg-meta"><span class="msg-nick" style="color:${c}">${m.user}</span><span class="msg-time">${m.time||''}</span></div><div class="msg-txt">${m.text}</div></div>`;
    }
    box.scrollTop = box.scrollHeight;
}

function renderUsers(users) {
    document.getElementById('onC').textContent = users.length; document.getElementById('roomC').textContent = users.length; let h='';
    users.forEach(u => { h += createUserHTML(u); }); document.getElementById('uList').innerHTML = h;
}
function addUserToUI(user) { document.getElementById('uList').innerHTML += createUserHTML(user); const c=document.getElementById('onC'); c.textContent=parseInt(c.textContent)+1; document.getElementById('roomC').textContent=c.textContent; }
function removeUserFromUI(id) { const el=document.getElementById('u-'+id); if(el)el.remove(); const c=document.getElementById('onC'); c.textContent=Math.max(0,parseInt(c.textContent)-1); document.getElementById('roomC').textContent=c.textContent; }

function createUserHTML(u) {
    const c = getCol(u.name); const micClass = u.micOn ? 'mic-on' : ''; const speakClass = u.isSpeaking ? 'speaking-pulse' : '';
    const micIcon = u.micOn ? 'fa-microphone' : 'fa-microphone-slash';
    return `<div class="u-item" id="u-${u.id}">
        <div class="u-av" style="background:${c}22;color:${c}">${u.name[0].toUpperCase()}<div class="u-dot on"></div></div>
        <div class="u-info"><div class="u-name">${u.name}</div><div class="u-status ${micClass} ${speakClass}"><i class="fas ${micIcon}"></i> ${u.micOn?(u.isSpeaking?'Konuşuyor':'Dinlemede'):'Sessiz'}</div></div>
        <div class="u-actions">
            <button onclick="openPrivChat('${u.name}')" title="Özel Mesaj"><i class="fas fa-comment"></i></button>
            <button onclick="startCall('${u.name}', false)" title="Sesli Ara"><i class="fas fa-phone"></i></button>
            <button onclick="startCall('${u.name}', true)" title="Görüntülü Ara"><i class="fas fa-video"></i></button>
        </div>
    </div>`;
}

function updateMicUI(id, isOn) {
    const el=document.getElementById('u-'+id); if(!el)return; const st=el.querySelector('.u-status'); const ic=st.querySelector('i');
    if(isOn){st.classList.add('mic-on');ic.className='fas fa-microphone';st.lastChild.textContent=' Dinlemede';}
    else{st.classList.remove('mic-on','speaking-pulse');ic.className='fas fa-microphone-slash';st.lastChild.textContent=' Sessiz';}
}
function updateSpeakingUI(id, isSpeaking) {
    const el=document.getElementById('u-'+id); if(!el)return; const st=el.querySelector('.u-status');
    if(isSpeaking){st.classList.add('speaking-pulse');st.lastChild.textContent=' Konuşuyor';}
    else{st.classList.remove('speaking-pulse');st.lastChild.textContent=' Dinlemede';}
}

   5. EVENT LISTENERS

    document.getElementById('loginBtn').addEventListener('click', handleLogin);
    document.getElementById('nickInp').addEventListener('keydown', (e) => { if(e.key === 'Enter') handleLogin(); });

    document.getElementById('msgInp').addEventListener('keydown', (e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } });
    document.getElementById('msgInp').addEventListener('input', function() { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 60) + 'px'; });
    document.getElementById('micToggle').addEventListener('click', toggleMic);
    document.getElementById('hMicBtn').addEventListener('click', toggleMic);
    document.getElementById('privSendBtn').addEventListener('click', sendPrivMsg);
    document.getElementById('privInp').addEventListener('keydown', (e) => { if(e.key === 'Enter') sendPrivMsg(); });
    document.getElementById('mobMenuBtn').addEventListener('click', () => { closeMob(); document.getElementById('panelL').classList.add('open'); document.getElementById('mobOv').classList.add('show'); });
    document.getElementById('mobUsersBtn').addEventListener('click', () => { closeMob(); document.getElementById('panelR').classList.add('open'); document.getElementById('mobOv').classList.add('show'); });
});
